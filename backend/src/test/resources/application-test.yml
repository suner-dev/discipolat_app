spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=key,value,year,month,day
    username: sa
    password:
  sql:
    init:
      mode: embedded
      schema-locations: classpath:h2-init.sql
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  jwt:
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
    private-key: ""
    public-key: ""
  cors:
    allowed-origins: http://localhost:3000
  encryption:
    aes-key: 0d+/whEBDccfi6JPzoJAOF3yGEwC8apvSzzMmF94IPE=
