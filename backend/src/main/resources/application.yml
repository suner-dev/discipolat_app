server:
  port: ${PORT:8080}

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: discipolat-api
  datasource:
    url: jdbc:postgresql://localhost:5432/discipolat
    username: discipolat
    password: discipolat_secret
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:50}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: 60000
      pool-name: DiscipolatHikariPool
      register-mbeans: true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC
  cache:
    cache-names: evaluationScores,dashboardKpi,dashboardTrends
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:noreply@discipolat.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  threads:
    virtual:
      enabled: true

app:
  # Environnement de déploiement : dev | docker | beta | prod
  # beta-mode active le badge BÊTA et les fonctionnalités de bêta-testing.
  environment: ${APP_ENVIRONMENT:dev}
  version: ${APP_VERSION:1.0.0}
  bootstrap:
    superadmin-enabled: ${SUPERADMIN_BOOTSTRAP_ENABLED:false}
    superadmin-email: ${SUPERADMIN_BOOTSTRAP_EMAIL:}
    superadmin-secret: ${SUPERADMIN_BOOTSTRAP_SECRET:}
  beta-testing:
    # Comptes de démonstration visibles sur l'écran de connexion (bêta uniquement)
    demo-accounts-enabled: ${DEMO_ACCOUNTS_ENABLED:false}
    # Création/activation des comptes de démonstration (DataInitializer) —
    # VRAI uniquement en bêta. En prod : AUCUN compte de test n'est créé.
    seed-demo-accounts: ${DEMO_SEED_ENABLED:false}
    # Réinitialisation de l'environnement bêta (admin) — strictement inactif en prod
    reset-enabled: ${BETA_RESET_ENABLED:false}
  jwt:
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
  cors:
    # Wildcards supportés via setAllowedOriginPatterns (ex. tunnels ngrok / cloudflared)
    allowed-origins: ${FRONTEND_URL:http://localhost:3000,http://localhost:5173,https://*.ngrok-free.dev,https://*.ngrok.io,https://*.trycloudflare.com}
  frontend-url: ${FRONTEND_URL_BASE:http://localhost:5173}
  # ---------------------------------------------------------------------
  # A1 (M1 + M3) — Notifications push Firebase Cloud Messaging
  # ---------------------------------------------------------------------
  # Par defaut DESACTIVE et en DRY-RUN : aucun envoi reel tant que le service
  # account n'est pas fourni. Le service account est lu depuis un FICHIER
  # (jamais une variable d'environnement en clair, jamais versionne).
  # Quand enabled=false, NoOpPushGateway est selectionne et journalise un
  # AVERTISSEMENT UNE SEULE fois au demarrage : les push sont VOLONTAIREMENT
  # perdus, ce n'est jamais un echec silencieux. Etat expose par
  # GET /api/v1/notifications/push-status pour que l'UI et le mobile puissent
  # afficher un etat honnete.
  push:
    enabled: ${APP_PUSH_ENABLED:false}
    credentials-path: ${APP_PUSH_CREDENTIALS_PATH:}
    # true = journalise la charge utile au lieu d'envoyer. Indispensable avant
    # de disposer de vraies credentials.
    dry-run: ${APP_PUSH_DRY_RUN:true}

  # ---------------------------------------------------------------------
  # A4 (M5 + M6) — Configuration honnete de l'IA et de la reconnaissance vocale
  # ---------------------------------------------------------------------
  # M6 : « aucune IA disponible » doit etre distinguable de « IA cassee ».
  # Tant que enabled=false, AUCUN appel n'est effectue et OllamaHealth
  # signale la cle manquante ; les chemins IA doivent repondre
  # 503 AI_NOT_CONFIGURED plutot qu'une erreur de connexion.
  ollama:
    enabled: ${OLLAMA_ENABLED:false}
    # DEFAUT VIDE, et c'est deliberé (M6). Un défaut « localhost » en production
    # fait que l'IA tente de joindre localhost:11434 et echoue en silence. Vide =
    # fail-closed : aucune tentative, et le moteur deterministe de repli prend le
    # relais avec un warning clair au demarrage.
    url: ${OLLAMA_URL:}
    model: ${OLLAMA_MODEL:llama3}
    # Un LLM lent ne doit pas bloquer un thread de requete indefiniment. Le
    # timeout est REELLEMENT APPLIQUE (RestTemplateBuilder), pas seulement declare.
    timeout: ${OLLAMA_TIMEOUT:30s}
  # M5 : la reconnaissance vocale etait ABSENTE de la configuration alors que
  # des features la referencent. Sans api-url + api-key, le fournisseur reste
  # « non configure » et repond 503 STT_NOT_CONFIGURED — aucune transcription
  # n'est inventee. La cle n'est JAMAIS journalisee (masquee par toString).
  speech:
    enabled: ${APP_SPEECH_ENABLED:false}
    api-url: ${APP_SPEECH_API_URL:}
    api-key: ${APP_SPEECH_API_KEY:}
    model: ${APP_SPEECH_MODEL:whisper-1}
    timeout: ${APP_SPEECH_TIMEOUT:60s}
    # PLAFORME DUREE : un envoi audio non borne est un DoS. La valeur est
    # REELLEMENT VERIFIEE avant tout traitement ; au-dela, 413.
    max-file-bytes: ${APP_SPEECH_MAX_FILE_BYTES:26214400}   # 25 MiB

  # ---------------------------------------------------------------------
  # A2 (M2) — Sauvegardes applicatives
  # ---------------------------------------------------------------------
  # Racine de stockage des archives. Relus par un tenant dans son propre
  # sous-repertoire ; les noms de fichiers sont valides (pas de traversee de
  # chemin). retention-days <= 0 desactive la purge.
  backup:
    root: ${APP_BACKUP_ROOT:./backups}
    retention-days: ${APP_BACKUP_RETENTION_DAYS:30}

  whatsapp:
    # Pont WhatsApp Business Cloud API — désactivé tant que les credentials Meta ne sont pas fournis.
    enabled: ${WHATSAPP_ENABLED:false}
  mobilemoney:
    # Bascule générale : passer en mode appels opérateurs réels.
    # false = fallback local (référence générée, pas d'appel API opérateur).
    enabled: ${MOBILEMONEY_ENABLED:false}
    orange:
      api-key: ${ORANGE_API_KEY:}
      merchant-key: ${ORANGE_MERCHANT_KEY:}
      client-secret: ${ORANGE_CLIENT_SECRET:}
      base-url: ${ORANGE_BASE_URL:https://api.orange.com}
      webhook-secret: ${ORANGE_WEBHOOK_SECRET:}
      return-url: ${ORANGE_RETURN_URL:http://localhost:5173/giving}
      notif-url: ${ORANGE_NOTIF_URL:}
    mtn:
      base-url: ${MTN_BASE_URL:https://sandbox.momodeveloper.mtn.com}
      subscription-key: ${MTN_SUBSCRIPTION_KEY:}
      client-id: ${MTN_CLIENT_ID:}
      client-secret: ${MTN_CLIENT_SECRET:}
      webhook-secret: ${MTN_WEBHOOK_SECRET:}
    mpesa:
      base-url: ${MPESA_BASE_URL:https://sandbox.safaricom.co.ke}
      consumer-key: ${MPESA_CONSUMER_KEY:}
      consumer-secret: ${MPESA_CONSUMER_SECRET:}
      short-code: ${MPESA_SHORT_CODE:}
      passkey: ${MPESA_PASSKEY:}
      webhook-secret: ${MPESA_WEBHOOK_SECRET:}
      notif-url: ${MPESA_NOTIF_URL:}
  payments:
    # Secret partagé accepté sur le webhook opérateur (vide => endpoint fermé, 503).
    webhook-secret: ${PAYMENTS_WEBHOOK_SECRET:}
    # Intervalle de poll des paiements PENDING (MTN MoMo n'a pas de webhook).
    webhook:
      poll-interval-ms: ${PAYMENTS_WEBHOOK_POLL_INTERVAL_MS:30000}
    # Mode simulation robuste : confirme automatiquement les paiements PENDING
    # sans passerelle réelle (utile en beta/dev pour rendre le module fonctionnel
    # dîmes & offrandes de bout en bout). En production, laisser à 0 et
    # brancher l'API opérateur via le webhook.
    # Délai avant confirmation automatique d'une intention PENDING (ms).
    # 0 = désactivé (paiements confirmés uniquement par le webhook opérateur).
    simulate-confirm-delay-ms: ${PAYMENTS_SIMULATE_CONFIRM_DELAY_MS:0}
    # Délai de confirmation auto pour les rôles autres que gestionnaires (ms),
    # appliqué lorsque la simulation est active. Par défaut identique au délai nominal.
    simulate-confirm-delay-non-manager-ms: ${PAYMENTS_SIMULATE_CONFIRM_DELAY_NON_MANAGER_MS:0}
    # Périodicité du balayage des intentions en attente (ms).
    simulate-scan-interval-ms: ${PAYMENTS_SIMULATE_SCAN_INTERVAL_MS:5000}
    # ===== A3 (M8) — Canaux de DÉCAISSEMENT (payouts) =====
    # Chaque canal est désactivé par défaut (fail-closed) : enabled=true SANS
    # credentials réels donne un disabledReason explicite dans le registre, et
    # un initiate() qui refuse honnêtement (503) — jamais un faux succès.
    # Les montants sont en unités mineures ISO-4217 ; webhook HMAC fail-closed.
    providers:
      stripe:      # Stripe Transfers (compte Connect/standard) — collect vs payout distincts
        enabled: ${PAYOUT_STRIPE_ENABLED:false}
        api-key: ${PAYOUT_STRIPE_API_KEY:}
        api-secret: ${PAYOUT_STRIPE_API_SECRET:}
        base-url: ${PAYOUT_STRIPE_BASE_URL:}
        webhook-secret: ${PAYOUT_STRIPE_WEBHOOK_SECRET:}
      paypal:      # PayPal Payouts v1 (client credentials)
        enabled: ${PAYOUT_PAYPAL_ENABLED:false}
        api-key: ${PAYOUT_PAYPAL_CLIENT_ID:}
        api-secret: ${PAYOUT_PAYPAL_CLIENT_SECRET:}
        base-url: ${PAYOUT_PAYPAL_BASE_URL:}
        webhook-secret: ${PAYOUT_PAYPAL_WEBHOOK_SECRET:}
      sepa:        # Prélèvement/virement SEPA via connecteur bancaire (IBAN mod-97 validé)
        enabled: ${PAYOUT_SEPA_ENABLED:false}
        api-key: ${PAYOUT_SEPA_API_KEY:}
        api-secret: ${PAYOUT_SEPA_API_SECRET:}
        base-url: ${PAYOUT_SEPA_BASE_URL:}
        webhook-secret: ${PAYOUT_SEPA_WEBHOOK_SECRET:}
      bank:        # Virement bancaire manuel : références E2E générées, statut par rapprochement
        enabled: ${PAYOUT_BANK_ENABLED:false}
      # Mobile Money : l'API de DÉCAISSEMENT opérateur est un produit distinct de
      # la collecte (module mobile-money ci-dessus). Ces drapeaux exposent l'état
      # réel ; tant que le compte disbursement n'est pas branché, initiate() répond
      # 503 PAYOUT_DISBURSEMENT_NOT_INTEGRATED (honnête, jamais simulé).
      mtn:
        enabled: ${PAYOUT_MTN_ENABLED:false}
      orange:
        enabled: ${PAYOUT_ORANGE_ENABLED:false}
      mpesa:
        enabled: ${PAYOUT_MPESA_ENABLED:false}
  scaling:
    # A3 (M7) — taille de l'anneau de sharding : shard = hash(tenantId) % N.
    # 1 = routage unique (comportement actuel, zéro régression). Changer N est
    # une OPÉRATION PLANIFIÉE (re-sharding), pas un simple redémarrage :
    # voir docs/SCALING.md Niveau 3.
    shard-count: ${SCALING_SHARD_COUNT:1}
  stripe:
    # Facturation SaaS par abonnement (carte bancaire) — DÉSACTIVÉ par défaut :
    # s'active dès que STRIPE_SECRET_KEY est fournie (clé sk_test/... ou sk_live/...).
    secret-key: ${STRIPE_SECRET_KEY:}
    # Secret du endpoint webhook (whsec_...) — obligatoire pour accepter des webhooks (fail-closed).
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    # URLs de retour post-checkout (face avant).
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173/billing?checkout=success}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/pricing?checkout=cancelled}
  encryption:
    # Clé AES-256 (base64, 32 octets) pour le chiffrement au repos des données sensibles.
    # Générer avec : openssl rand -base64 32
    aes-key: ${ENCRYPTION_AES_KEY:}
  rate-limiting:
    # Redis connection URL for distributed rate limiting
    redis-url: ${REDIS_URL:redis://localhost:6379}
    # Bucket key expiry in Redis after inactivity (minutes)
    redis-key-expire-minutes: 10
    # Rate limit capacities (per-IP, per minute)
    login-capacity: 10
    login-refill: 10
    login-period-minutes: 1
    refresh-capacity: 20
    refresh-refill: 20
    refresh-period-minutes: 1
    forgot-password-capacity: 3
    forgot-password-refill: 3
    forgot-password-period-minutes: 1
    reset-password-capacity: 5
    reset-password-refill: 5
    reset-password-period-minutes: 1
    activate-capacity: 5
    activate-refill: 5
    activate-period-minutes: 1
    change-password-capacity: 5
    change-password-refill: 5
    change-password-period-minutes: 1
    switch-role-capacity: 30
    switch-role-refill: 30
    switch-role-period-minutes: 1
    # Suivi d'une demande d'inscription (endpoint PUBLIC) : 3 requetes / 5 min / IP.
    # Sans cette borne, la page « Suivre ma demande » devient un oracle
    # d'existence de compte pour n'importe quelle adresse email.
    registration-status-capacity: 3
    registration-status-refill: 3
    registration-status-period-minutes: 5

  scheduler:
    absence-check-cron: "0 0 */6 * * *"
    report-reminder-cron: "0 0 8 * * MON"
    saturday-reminder-cron: "0 0 18 * * SAT"
    dashboard-metrics-cron: "0 0 2 * * *"
    transfer-delay-check-cron: "0 0 * * * *"
  ai:
    # Assistants IA (Ollama local). url = base Ollama (health check: GET /api/tags,
    # chat: POST /api/chat). model = modèle utilisé (ex. llama3, mistral, qwen2.5).
    # Si Ollama n'est pas joignable, un moteur de repli contextuel garantit
    # que l'assistant répond toujours (aucune panne visible côté utilisateur).
    # Le timeout est REELLEMENT APPLIQUE aux appels LLM (via RestTemplateBuilder) : une
    # cle « declaree mais non appliquee » est le meme defaut qu'une cle absente.
    # Sans lui, un LLM lent bloque un thread de requete indefiniment.
    timeout: ${APP_AI_TIMEOUT:30s}
    model: ${AI_MODEL:llama3}
    # LLM Providers gratuits (sans paiement, sans carte bancaire)
    # Tous ont un tiers gratuit généreux :
    # - Groq : ~15 req/min, modèle Llama 3.1 70B (le plus rapide)
    # - Gemini : 15 req/min, 1M tokens/mois gratuit (Google)
    # - Mistral : 5 req/min, 1M tokens/mois gratuit
    # - HuggingFace : 30k req/mois gratuit
    groq-api-key: ${GROQ_API_KEY:}
    gemini-api-key: ${GEMINI_API_KEY:}
    mistral-api-key: ${MISTRAL_API_KEY:}
    huggingface-api-key: ${HUGGINGFACE_API_KEY:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.discipolat: DEBUG
    org.springframework.security: INFO
    org.springframework.modulith: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/discipolat.log
    max-size: 10MB
    max-history: 7

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://db:5432/discipolat
    username: ${SPRING_DATASOURCE_USERNAME:discipolat}
    password: ${SPRING_DATASOURCE_PASSWORD:discipolat_secret}
  data:
    redis:
      url: ${REDIS_URL:redis://redis:6379}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: ${PORT:8080}

app:
  environment: docker
  beta-testing:
    demo-accounts-enabled: ${DEMO_ACCOUNTS_ENABLED:false}
    seed-demo-accounts: ${DEMO_SEED_ENABLED:false}
    reset-enabled: ${BETA_RESET_ENABLED:false}
  payments:
  jwt:
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

logging:
  level:
    com.discipolat: DEBUG
    org.springframework.security: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  mail:
    host: ${MAIL_HOST:smtp.mailgun.org}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

management:
  health:
    mail:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: beta

app:
  environment: beta
  beta-testing:
    demo-accounts-enabled: true
    seed-demo-accounts: true
    reset-enabled: true
  payments:
    # Environnement bêta : module dîmes & offrandes fonctionnel de bout en bout
    # via la passerelle simulée (aucune confirmation réelle opérateur requise).

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  rate-limiting:
    redis-enabled: false
