server:
  port: ${PORT:8080}

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: discipolat-api
  datasource:
    url: jdbc:postgresql://localhost:5432/discipolat
    username: discipolat
    password: discipolat_secret
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC
  cache:
    cache-names: evaluationScores,dashboardKpi,dashboardTrends
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:noreply@discipolat.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  threads:
    virtual:
      enabled: true

app:
  # Environnement de déploiement : dev | docker | beta | prod
  # beta-mode active le badge BÊTA et les fonctionnalités de bêta-testing.
  environment: ${APP_ENVIRONMENT:dev}
  version: ${APP_VERSION:1.0.0}
  beta-testing:
    # Comptes de démonstration visibles sur l'écran de connexion (bêta uniquement)
    demo-accounts-enabled: ${DEMO_ACCOUNTS_ENABLED:false}
    # Création/activation des comptes de démonstration (DataInitializer) —
    # VRAI uniquement en bêta. En prod : AUCUN compte de test n'est créé.
    seed-demo-accounts: ${DEMO_SEED_ENABLED:false}
    # Réinitialisation de l'environnement bêta (admin) — strictement inactif en prod
    reset-enabled: ${BETA_RESET_ENABLED:false}
  jwt:
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
  cors:
    # Wildcards supportés via setAllowedOriginPatterns (ex. tunnels ngrok / cloudflared)
    allowed-origins: ${FRONTEND_URL:http://localhost:3000,http://localhost:5173,https://*.ngrok-free.dev,https://*.ngrok.io,https://*.trycloudflare.com}
  frontend-url: ${FRONTEND_URL_BASE:http://localhost:5173}
  whatsapp:
    # Pont WhatsApp Business Cloud API — désactivé tant que les credentials Meta ne sont pas fournis.
    enabled: ${WHATSAPP_ENABLED:false}
  payments:
    # Secret partagé accepté sur le webhook opérateur (vide => endpoint fermé, 503).
    webhook-secret: ${PAYMENTS_WEBHOOK_SECRET:}
    # Intervalle de poll des paiements PENDING (MTN MoMo n'a pas de webhook).
    webhook:
      poll-interval-ms: ${PAYMENTS_WEBHOOK_POLL_INTERVAL_MS:30000}
    # Mode simulation robuste : confirme automatiquement les paiements PENDING
    # sans passerelle réelle (utile en beta/dev pour rendre le module fonctionnel
    # dîmes & offrandes de bout en bout). En production, laisser à false et
    # brancher l'API opérateur via le webhook.
    simulate-auto-confirm: ${PAYMENTS_SIMULATE_AUTO_CONFIRM:false}
    # Délai avant confirmation automatique d'une intention PENDING (ms).
    simulate-confirm-delay-ms: ${PAYMENTS_SIMULATE_CONFIRM_DELAY_MS:6000}
    # Délai de confirmation auto pour les rôles autres que gestionnaires (ms),
    # appliqué lorsque la simulation est active. Par défaut identique au délai nominal.
    simulate-confirm-delay-non-manager-ms: ${PAYMENTS_SIMULATE_CONFIRM_DELAY_NON_MANAGER_MS:6000}
    # Périodicité du balayage des intentions en attente (ms).
    simulate-scan-interval-ms: ${PAYMENTS_SIMULATE_SCAN_INTERVAL_MS:5000}
  encryption:
    # Clé AES-256 (base64, 32 octets) pour le chiffrement au repos des données sensibles.
    # Générer avec : openssl rand -base64 32
    aes-key: ${ENCRYPTION_AES_KEY:}
  rate-limiting:
    # Redis connection URL for distributed rate limiting
    redis-url: ${REDIS_URL:redis://localhost:6379}
    # Bucket key expiry in Redis after inactivity (minutes)
    redis-key-expire-minutes: 10
    # Rate limit capacities (per-IP, per minute)
    login-capacity: 10
    login-refill: 10
    login-period-minutes: 1
    refresh-capacity: 20
    refresh-refill: 20
    refresh-period-minutes: 1
    forgot-password-capacity: 3
    forgot-password-refill: 3
    forgot-password-period-minutes: 1
    reset-password-capacity: 5
    reset-password-refill: 5
    reset-password-period-minutes: 1
    activate-capacity: 5
    activate-refill: 5
    activate-period-minutes: 1
    change-password-capacity: 5
    change-password-refill: 5
    change-password-period-minutes: 1
    switch-role-capacity: 30
    switch-role-refill: 30
    switch-role-period-minutes: 1

  scheduler:
    absence-check-cron: "0 0 */6 * * *"
    report-reminder-cron: "0 0 8 * * MON"
    saturday-reminder-cron: "0 0 18 * * SAT"
    dashboard-metrics-cron: "0 0 2 * * *"
    transfer-delay-check-cron: "0 0 * * * *"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.discipolat: DEBUG
    org.springframework.security: INFO
    org.springframework.modulith: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/discipolat.log
    max-size: 10MB
    max-history: 7

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://db:5432/discipolat
    username: ${SPRING_DATASOURCE_USERNAME:discipolat}
    password: ${SPRING_DATASOURCE_PASSWORD:discipolat_secret}
  data:
    redis:
      url: ${REDIS_URL:redis://redis:6379}
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

app:
  environment: docker
  beta-testing:
    demo-accounts-enabled: true
    seed-demo-accounts: true
    reset-enabled: true
  payments:
    simulate-auto-confirm: true
  jwt:
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

logging:
  level:
    com.discipolat: DEBUG
    org.springframework.security: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  mail:
    host: ${MAIL_HOST:smtp.mailgun.org}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

management:
  health:
    mail:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: beta

app:
  environment: beta
  beta-testing:
    demo-accounts-enabled: true
    seed-demo-accounts: true
    reset-enabled: true
  payments:
    # Environnement bêta : module dîmes & offrandes fonctionnel de bout en bout
    # via la passerelle simulée (aucune confirmation réelle opérateur requise).
    simulate-auto-confirm: true

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  rate-limiting:
    redis-enabled: false
