name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Le job « backend » joue la suite sous son profil de test réel (H2),
  # exactement comme en local. L'ancienne version surchargeait la datasource
  # avec SPRING_DATASOURCE_URL vers le service PostgreSQL : 9 classes
  # écrites pour H2 (SET REFERENTIAL_INTEGRITY) échouaient en
  # BadSqlGrammarException — un rouge permanent qui ne disait rien de la
  # production. La vraie base PostgreSQL est couverte par le job
  # « backend-gates » (Testcontainers), et le nettoyage des tests est
  # désormais dialecte-indépendant (com.discipolat.support.DatabaseReset).
  backend:
    name: Backend - Tests (H2, profil test)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
      - name: Generate test keys
        run: |
          mkdir -p keys
          openssl genpkey -algorithm RSA -out keys/private.pem -pkeyopt rsa_keygen_bits:2048
          openssl pkey -in keys/private.pem -pubout -out keys/public.pem
      - name: Build & Test
        run: cd backend && mvn verify -B
        env:
          JWT_PRIVATE_KEY_PATH: ${{ github.workspace }}/keys/private.pem
          JWT_PUBLIC_KEY_PATH: ${{ github.workspace }}/keys/public.pem
          REDIS_URL: redis://localhost:6379
      # A5 #7 — rapports de tests conservés comme artifacts (même en cas
      # d'échec : c'est là qu'ils servent). Bloquant : l'étape mvn verify
      # ci-dessus fait déjà échouer le job.
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports-${{ github.run_id }}
          path: backend/target/surefire-reports/
          retention-days: 14

  # Gates conteneurisées : la chaîne Flyway rejouée sur PostgreSQL 16 réel
  # et le contrat de table des événements. Ce sont elles qui attrapent la
  # dérive entité↔schéma que le profil H2 masque (familles H1-H5).
  backend-gates:
    name: Backend - Gates PostgreSQL (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
      - name: Generate test keys
        run: |
          mkdir -p keys
          openssl genpkey -algorithm RSA -out keys/private.pem -pkeyopt rsa_keygen_bits:2048
          openssl pkey -in keys/private.pem -pubout -out keys/public.pem
      - name: Gates sur PostgreSQL réel
        run: cd backend && mvn -B test -Dtest='FlywayMigrationChainPostgreSqlTest,EventTableContractTest'
        env:
          JWT_PRIVATE_KEY_PATH: ${{ github.workspace }}/keys/private.pem
          JWT_PUBLIC_KEY_PATH: ${{ github.workspace }}/keys/public.pem
      - name: Upload gates reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-gates-reports-${{ github.run_id }}
          path: backend/target/surefire-reports/
          retention-days: 14

  frontend:
    name: Frontend - Build & Lint
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://discipolat-api.onrender.com
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit
      - name: Lint (bloquant — 0 erreur)
        run: cd frontend && npm run lint
      - name: Run tests
        # double reporter : sortie lisible dans le log + junit.xml uploadé
        run: cd frontend && npx vitest run --reporter=default --reporter=junit --outputFile.junit=./test-results/junit.xml
      - name: Upload frontend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitest-reports-${{ github.run_id }}
          path: frontend/test-results/
          retention-days: 14
      - name: Build
        run: cd frontend && npm run build
      - name: Audit i18n (ratchet de non-régression)
        run: cd frontend && npm run i18n:audit
      - name: Dette technique frontend (ratchet de non-régression)
        run: cd frontend && npm run debt:audit

  mobile:
    name: Mobile - Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
      - name: Get dependencies
        run: cd mobile && flutter pub get
      - name: Analyze
        run: cd mobile && flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos
      - name: Test
        # --file-reporter json : rapport machine archivé en artifact, console
        # console reste lisible ; le code de sortie de flutter test reste bloquant.
        run: cd mobile && flutter test --no-pub --file-reporter json:flutter-test-report.json
      - name: Upload mobile test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-flutter-test-report-${{ github.run_id }}
          path: mobile/flutter-test-report.json
          retention-days: 14
      - name: Build APK
        run: cd mobile && flutter build apk --debug --no-pub

  # V0.2 (TODO_BACKEND_V0_CLEAN_ARCH.md) — rapport de taille. Informatif : le gate est « le job
  # publie un rapport », pas « la dette est nulle ». Équivalent exact du job report:size de
  # .gitlab-ci.yml. ubuntu-latest parce que les scripts s'appuient sur find/xargs GNU.
  # V0.16 ajoute le palier de pilotage des couples R6 : même philosophie — le classement est
  # publié, il ne bloque pas. Seule `--check` bloque, et elle ne peut rougir que sur un gel
  # impossible (0 couple, ligne mal formée, arête dupliquée, contexte sans dossier) : jamais sur
  # le volume de dette, qui est précisément ce que le gel assume.
  report-size:
    name: Rapports de taille (V0.2) et de couples (V0.16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auto-validation du pipeline GitLab (miroir de la porte GitLab `ci:self-check`)
        # Meme commande, meme porte que le stage `validate` de .gitlab-ci.yml. Pourquoi ici alors
        # que GitHub n'execute pas ce pipeline : GitHub est la plateforme qui tourne AUJOURD'HUI,
        # et un defaut de structure GitLab doit rougir avant le push, pas au premier run GitLab.
        # Blast radius nul : ce job n'est dans le `needs:` de personne (deploy-render ne depend pas
        # de lui), et `report-size` reste un job de rapport, pas une porte de deploiement.
        run: |
          python3 -c "import yaml" || pip install --quiet pyyaml==6.0.1
          python3 scripts/gitlab-ci-selfcheck.py --file .gitlab-ci.yml
      - name: Générer les rapports
        run: |
          bash scripts/report-size.sh --out reports/size-report.txt
          bash scripts/architecture-couples.sh --check
          # --top 60 : au-dessus du nombre de couples (44 mesurés le 2026-10-10 dans l'image du job,
          # et la liste ne fait que décroître au fil de V0.15) — le gate V0.16 exige le classement
          # COMPLET, pas un extrait.
          bash scripts/architecture-couples.sh --top 60 --out reports/couples-report.txt
          sed -n '1,6p' reports/size-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,24p' reports/couples-report.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-report-${{ github.run_id }}
          path: |
            reports/size-report.txt
            reports/couples-report.txt
          retention-days: 30

  # SBOM par production (ADR-008 §4). GitHub est la plateforme qui tourne AUJOURD'HUI : la preuve
  # de due-diligence doit commencer maintenant, pas au jour de la bascule GitLab. Mêmes versions
  # épinglées que .gitlab-ci.yml (jobs `sbom:backend` / `sbom:frontend` depuis le 2026-10-10), rejouées
  # localement le 2026-10-09 : 244 composants backend, 407 composants frontend.
  # continue-on-error : la génération résout les dépendances depuis le réseau ; un échec de
  # résolution n'est pas un défaut de code. À passer en bloquant après le premier vert observé.
  sbom:
    name: SBOM (CycloneDX, due-diligence)
    runs-on: ubuntu-latest
    needs: []
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SBOM backend
        run: |
          cd backend
          mvn -B -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom \
            -DoutputFormat=json -DoutputName=bom
          cd ..
          cp "$(find backend/target -name 'bom*.json' | head -1)" sbom-backend.json
      - name: SBOM frontend
        run: |
          cd frontend
          npm ci --ignore-scripts
          # --package-lock-only : l'option --ignore-scripts de cyclonedx-npm n'existe plus en v6
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --package-lock-only --output-file ../sbom-frontend.json
      - name: Résumé
        run: |
          {
            echo "| SBOM | composants |"; echo "|---|---|"
            for f in sbom-backend.json sbom-frontend.json; do
              n=$(python3 -c "import json;print(len(json.load(open('$f')).get('components',[])))" 2>/dev/null || echo '?')
              echo "| $f | $n |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.run_id }}
          path: |
            sbom-backend.json
            sbom-frontend.json
          retention-days: 30

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend, backend-gates, frontend, mobile]
    if: github.ref == 'refs/heads/main'
    env:
      VITE_API_URL: https://discipolat-api.onrender.com
    steps:
      - uses: actions/checkout@v4

      # Rebuild backend JAR (target/ n'existe pas dans ce workspace)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
      - name: Generate JWT keys
        run: |
          mkdir -p keys
          openssl genpkey -algorithm RSA -out keys/private.pem -pkeyopt rsa_keygen_bits:2048
          openssl pkey -in keys/private.pem -pubout -out keys/public.pem
      - name: Build backend JAR
        run: cd backend && mvn package -DskipTests -q

      # NB: le frontend est un Static Site Render (runtime: static) —
      # il est construit directement par Render depuis le dépôt
      # (buildCommand npm ci && npm run build). Plus d'image Docker
      # frontend à pousser sur GHCR.

      # Docker build & push (backend uniquement)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # PORTE DE DÉPLOIEMENT — l'étape « Deploy to Render » était ROUGE à chaque push
  # sur main, pour une raison de configuration GitHub et non de code : les secrets
  # RENDER_API_KEY / RENDER_API_SERVICE_ID sont ABSENTS du dépôt (0 entrée dans
  # `gh api repos/:owner/:repo/actions/secrets`), donc aucun déploiement n'est
  # possible tant que Render n'est pas provisionné (KNOWN_ISSUES E4/T2).
  #
  # Un rouge permanent qui ne dit rien de la production est du bruit : il rend la
  # CI de main illisible et finit par être ignoré. Le déploiement est donc
  # explicitement SKIP (job gris, jamais « vert en trompe-l'œil » comme
  # deploy-beta.yml) et l'état réel est énoncé par cette porte, qui écrit une
  # annotation et le résumé du run. Remettre `exit 1` ici n'a pas de sens : ce
  # qui manque est un secret, pas une étape.
  deploy-gate:
    name: Porte déploiement (Render provisionné ?)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      render_provisioned: ${{ steps.check.outputs.render_provisioned }}
    steps:
      - name: Détecter les secrets Render
        id: check
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
        run: |
          if [ -n "${RENDER_API_KEY:-}" ] && [ -n "${RENDER_API_SERVICE_ID:-}" ]; then
            echo "render_provisioned=true" >> "$GITHUB_OUTPUT"
            echo "Render provisionné : le déploiement va être déclenché."
          else
            echo "render_provisioned=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Aucun déploiement possible : secrets RENDER_API_KEY / RENDER_API_SERVICE_ID absents du dépôt (Settings → Secrets and variables → Actions). Image poussée sur ghcr.io, mais aucune instance Render ne la sert. Cf. KNOWN_ISSUES E4."
            {
              echo '## Déploiement Render — NON EXÉCUTÉ'
              echo
              echo '- Secrets `RENDER_API_KEY` / `RENDER_API_SERVICE_ID` : **absents** du dépôt.'
              echo '- Job `Deploy to Render` : `skipped` (gris), pas `failed`.'
              echo "- Conséquence : l'image ghcr.io construite par ce run n'est déployée nulle part."
              echo '- Référence : KNOWN_ISSUES E4 (canal public absent) et T2 (environnements non provisionnés).'
              echo '- À reprendre le jour du provisionnement : ajouter les deux secrets — la porte se rouvre seule.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [docker, deploy-gate]
    if: github.ref == 'refs/heads/main' && needs.deploy-gate.outputs.render_provisioned == 'true'
    steps:
      - name: Trigger Render Deploy (API)
        env:
          # Secrets via `env:` et non interpolés dans le script : un caractère
          # inattendu dans la valeur ne peut plus casser la syntaxe bash ni
          # l'URL (run 38261375312 : curl sortait en exit 3 « URL malformée »,
          # sans qu'aucun message ne dise pourquoi — diagnostic muet).
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
        run: |
          # Auto-diagnostic sans révéler la valeur : format + longueur seule.
          if [ -z "$RENDER_SERVICE_ID" ] || [ -z "$RENDER_API_KEY" ]; then
            echo "::error::Secret RENDER_API_KEY ou RENDER_API_SERVICE_ID vide côté GitHub (Settings → Secrets → Actions)."
            exit 1
          fi
          echo "Service ID reçu : ${#RENDER_SERVICE_ID} caractères, préfixe '${RENDER_SERVICE_ID:0:4}…' (valeur non loguée)."
          if ! printf '%s' "$RENDER_SERVICE_ID" | grep -qE '^srv-[0-9a-z]+$'; then
            echo "::error::RENDER_API_SERVICE_ID n'a pas le format attendu « srv- » + minuscules/alphanumérique. Coller UNIQUEMENT l'identifiant visible dans l'URL du service (dashboard.render.com/web/srv-XXXX → « srv-XXXX »), pas l'URL complète, sans espace ni retour à la ligne."
            exit 1
          fi
          HTTP_CODE=$(curl -s -o /tmp/render_deploy.json -w '%{http_code}' \
            -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}') || {
            echo "::error::Requête curl vers api.render.com impossible (exit $? — réseau ou URL)."
            exit 1
          }
          echo "Render API responded with HTTP $HTTP_CODE"
          cat /tmp/render_deploy.json
          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "::error::Render a refusé le déploiement (HTTP $HTTP_CODE). 401/403 = clé API invalide (en recréer une) ; 404 = Service ID erroné ou service supprimé."
            exit 1
          fi
          echo "::notice::Déploiement Render déclenché avec succès"
      # NB: le frontend (Static Site) se redéploie automatiquement à
      # chaque push sur main — aucun trigger API nécessaire.
      - name: Wait for Deployments
        run: |
          echo "Deployments triggered! Check Render Dashboard:"
          echo "- API: https://dashboard.render.com/"
          echo "- Web (static site, auto-deploy): https://dashboard.render.com/"
