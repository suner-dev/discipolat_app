name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Le job « backend » joue la suite sous son profil de test réel (H2),
  # exactement comme en local. L'ancienne version surchargeait la datasource
  # avec SPRING_DATASOURCE_URL vers le service PostgreSQL : 9 classes
  # écrites pour H2 (SET REFERENTIAL_INTEGRITY) échouaient en
  # BadSqlGrammarException — un rouge permanent qui ne disait rien de la
  # production. La vraie base PostgreSQL est couverte par le job
  # « backend-gates » (Testcontainers), et le nettoyage des tests est
  # désormais dialecte-indépendant (com.discipolat.support.DatabaseReset).
  backend:
    name: Backend - Tests (H2, profil test)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
      - name: Generate test keys
        run: |
          mkdir -p keys
          openssl genpkey -algorithm RSA -out keys/private.pem -pkeyopt rsa_keygen_bits:2048
          openssl pkey -in keys/private.pem -pubout -out keys/public.pem
      - name: Build & Test
        run: cd backend && mvn verify -B
        env:
          JWT_PRIVATE_KEY_PATH: ${{ github.workspace }}/keys/private.pem
          JWT_PUBLIC_KEY_PATH: ${{ github.workspace }}/keys/public.pem
          REDIS_URL: redis://localhost:6379
      # A5 #7 — rapports de tests conservés comme artifacts (même en cas
      # d'échec : c'est là qu'ils servent). Bloquant : l'étape mvn verify
      # ci-dessus fait déjà échouer le job.
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports-${{ github.run_id }}
          path: backend/target/surefire-reports/
          retention-days: 14

  # Gates conteneurisées : la chaîne Flyway rejouée sur PostgreSQL 16 réel
  # et le contrat de table des événements. Ce sont elles qui attrapent la
  # dérive entité↔schéma que le profil H2 masque (familles H1-H5).
  backend-gates:
    name: Backend - Gates PostgreSQL (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
      - name: Generate test keys
        run: |
          mkdir -p keys
          openssl genpkey -algorithm RSA -out keys/private.pem -pkeyopt rsa_keygen_bits:2048
          openssl pkey -in keys/private.pem -pubout -out keys/public.pem
      - name: Gates sur PostgreSQL réel
        run: cd backend && mvn -B test -Dtest='FlywayMigrationChainPostgreSqlTest,EventTableContractTest'
        env:
          JWT_PRIVATE_KEY_PATH: ${{ github.workspace }}/keys/private.pem
          JWT_PUBLIC_KEY_PATH: ${{ github.workspace }}/keys/public.pem
      - name: Upload gates reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-gates-reports-${{ github.run_id }}
          path: backend/target/surefire-reports/
          retention-days: 14

  frontend:
    name: Frontend - Build & Lint
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://discipolat-api.onrender.com
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit
      - name: Lint (bloquant — 0 erreur)
        run: cd frontend && npm run lint
      - name: Run tests
        # double reporter : sortie lisible dans le log + junit.xml uploadé
        run: cd frontend && npx vitest run --reporter=default --reporter=junit --outputFile.junit=./test-results/junit.xml
      - name: Upload frontend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitest-reports-${{ github.run_id }}
          path: frontend/test-results/
          retention-days: 14
      - name: Build
        run: cd frontend && npm run build
      - name: Audit i18n (ratchet de non-régression)
        run: cd frontend && npm run i18n:audit
      - name: Dette technique frontend (ratchet de non-régression)
        run: cd frontend && npm run debt:audit

  mobile:
    name: Mobile - Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
      - name: Get dependencies
        run: cd mobile && flutter pub get
      - name: Analyze
        run: cd mobile && flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos
      - name: Test
        # --file-reporter json : rapport machine archivé en artifact, console
        # console reste lisible ; le code de sortie de flutter test reste bloquant.
        run: cd mobile && flutter test --no-pub --file-reporter json:flutter-test-report.json
      - name: Upload mobile test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-flutter-test-report-${{ github.run_id }}
          path: mobile/flutter-test-report.json
          retention-days: 14
      - name: Build APK
        run: cd mobile && flutter build apk --debug --no-pub

  # V0.2 (TODO_BACKEND_V0_CLEAN_ARCH.md) — rapport de taille. Informatif : le gate est « le job
  # publie un rapport », pas « la dette est nulle ». Équivalent exact du job report:size de
  # .gitlab-ci.yml. ubuntu-latest parce que le script s'appuie sur find/xargs GNU.
  report-size:
    name: Rapport de taille (V0.2, informatif)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Générer le rapport
        run: |
          bash scripts/report-size.sh --out reports/size-report.txt
          sed -n '1,6p' reports/size-report.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-report-${{ github.run_id }}
          path: reports/size-report.txt
          retention-days: 30

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend, backend-gates, frontend, mobile]
    if: github.ref == 'refs/heads/main'
    env:
      VITE_API_URL: https://discipolat-api.onrender.com
    steps:
      - uses: actions/checkout@v4

      # Rebuild backend JAR (target/ n'existe pas dans ce workspace)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
      - name: Generate JWT keys
        run: |
          mkdir -p keys
          openssl genpkey -algorithm RSA -out keys/private.pem -pkeyopt rsa_keygen_bits:2048
          openssl pkey -in keys/private.pem -pubout -out keys/public.pem
      - name: Build backend JAR
        run: cd backend && mvn package -DskipTests -q

      # NB: le frontend est un Static Site Render (runtime: static) —
      # il est construit directement par Render depuis le dépôt
      # (buildCommand npm ci && npm run build). Plus d'image Docker
      # frontend à pousser sur GHCR.

      # Docker build & push (backend uniquement)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check Render secrets
        run: |
          if [ -z "${{ secrets.RENDER_API_KEY }}" ] || [ -z "${{ secrets.RENDER_API_SERVICE_ID }}" ]; then
            echo "::error::Secrets RENDER_API_KEY et RENDER_API_SERVICE_ID manquants."
            echo "Ajoutez-les dans GitHub → Settings → Secrets and variables → Actions."
            echo "- RENDER_API_KEY : Dashboard Render → Account Settings → API Keys"
            echo "- RENDER_API_SERVICE_ID : Dashboard Render → discipolat-api → Settings → Service ID"
            exit 1
          fi
      - name: Trigger Render Deploy (API)
        run: |
          HTTP_CODE=$(curl -s -o /tmp/render_deploy.json -w '%{http_code}' \
            -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_API_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}')
          echo "Render API responded with HTTP $HTTP_CODE"
          cat /tmp/render_deploy.json
          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "::error::Render a refusé le déploiement (HTTP $HTTP_CODE). Vérifiez la clé API et le Service ID."
            exit 1
          fi
          echo "::notice::Déploiement Render déclenché avec succès"
      # NB: le frontend (Static Site) se redéploie automatiquement à
      # chaque push sur main — aucun trigger API nécessaire.
      - name: Wait for Deployments
        run: |
          echo "Deployments triggered! Check Render Dashboard:"
          echo "- API: https://dashboard.render.com/"
          echo "- Web (static site, auto-deploy): https://dashboard.render.com/"
