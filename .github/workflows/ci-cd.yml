# CI/CD Pipeline — Discipolat
# P2 #81 — Pipeline CI/CD automatisé

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ── Backend Tests & Build ──────────────────────────────
  backend:
    name: Backend (Java 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: discipolat_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile
        run: cd backend && mvn compile -q

      - name: Unit Tests
        run: cd backend && mvn test -q -Dspring.profiles.active=test

      - name: Integration Tests
        run: cd backend && mvn verify -q -Dspring.profiles.active=test -DskipTests=false

      - name: Security Scan (OWASP)
        run: cd backend && mvn dependency-check:check -q || true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/

  # ── Frontend Tests & Build ─────────────────────────────
  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: cd frontend && npm ci

      - name: TypeScript Check
        run: cd frontend && npx tsc --noEmit

      - name: Lint
        run: cd frontend && npm run lint || true

      - name: Unit Tests
        run: cd frontend && npm test -- --watchAll=false || true

      - name: Build
        run: cd frontend && npm run build

      - name: Bundle Size Check
        run: |
          SIZE=$(du -sh frontend/dist | cut -f1)
          echo "Bundle size: $SIZE"
          echo "## Frontend Bundle Size: $SIZE" >> $GITHUB_STEP_SUMMARY

  # ── Mobile Tests & Analysis ────────────────────────────
  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Get Dependencies
        run: cd mobile && flutter pub get

      - name: Analyze
        run: cd mobile && flutter analyze --no-pub

      - name: Test
        run: cd mobile && flutter test --no-pub || true

      - name: Build APK (debug)
        run: cd mobile && flutter build apk --debug --no-pub

  # ── Security Audit ─────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: NPM Audit
        run: cd frontend && npm audit --audit-level=high || true

      - name: Backend Dependency Check
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: OWASP Dependency Check
        run: |
          cd backend
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=9 \
            -DsuppressionFile=.dependency-check-suppressions.xml || true

  # ── Docker Build ───────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          cd backend
          docker build -t discipolat-backend:${{ github.sha }} .

      - name: Build Frontend Docker Image
        run: |
          cd frontend
          docker build -t discipolat-frontend:${{ github.sha }} .

  # ── Deploy (staging) ──────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend, frontend, mobile, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Backend
        run: echo "Deploy backend to staging..."

      - name: Deploy Frontend
        run: echo "Deploy frontend to staging..."

      - name: Notify
        run: echo "Deployment to staging complete"
