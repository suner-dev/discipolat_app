# CI/CD Pipeline — Discipolat
# P2 #81 — Pipeline CI/CD automatisé

name: CI/CD Pipeline

on:
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  # ── Backend Tests & Build ──────────────────────────────
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: discipolat_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Les tests signent de vrais JWT (RSA) : sans clés générées la suite
      # échoue — même recette que ci.yml (clés produites à la volée,
      # jamais commitées).
      - name: Generate test keys
        run: |
          mkdir -p keys
          openssl genpkey -algorithm RSA -out keys/private.pem -pkeyopt rsa_keygen_bits:2048
          openssl pkey -in keys/private.pem -pubout -out keys/public.pem

      - name: Compile
        run: cd backend && mvn compile -q

      - name: Unit Tests
        run: cd backend && mvn test -q -Dspring.profiles.active=test

      - name: Integration Tests
        run: cd backend && mvn verify -q -Dspring.profiles.active=test -DskipTests=false

      - name: Security Scan (OWASP)
        # Coordonnées complètes exigées : le plugin n'est pas déclaré dans le
        # pom, le préfixe nu « dependency-check:check » ne résoudrait pas.
        run: |
          cd backend
          mvn -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=9 \
            -DsuppressionFile=.dependency-check-suppressions.xml

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/

  # ── Frontend Tests & Build ─────────────────────────────
  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: cd frontend && npm ci

      - name: TypeScript Check
        run: cd frontend && npx tsc --noEmit

      - name: Lint
        run: cd frontend && npm run lint

      - name: Unit Tests
        run: cd frontend && npm test

      - name: Build
        run: cd frontend && npm run build

      - name: Bundle Size Check
        run: |
          SIZE=$(du -sh frontend/dist | cut -f1)
          echo "Bundle size: $SIZE"
          echo "## Frontend Bundle Size: $SIZE" >> $GITHUB_STEP_SUMMARY

  # ── Mobile Tests & Analysis ────────────────────────────
  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable

      - name: Get Dependencies
        run: cd mobile && flutter pub get

      - name: Analyze
        run: cd mobile && flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: cd mobile && flutter test --no-pub

      - name: Build APK (debug)
        run: cd mobile && flutter build apk --debug --no-pub

  # ── E2E critiques (Playwright) ─────────────────────────
  # PORTÉ de Develop1 (§G6.9) : chemin critique onboarding/membership sur
  # stack réelle (Postgres + Redis + backend démarré, seed démo). S'appuie sur
  # frontend/playwright.config.ts + frontend/e2e/critical-paths.spec.ts.
  e2e:
    name: E2E critiques (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: discipolat
          POSTGRES_USER: discipolat
          POSTGRES_PASSWORD: discipolat_secret
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps (Playwright)
        # Fournit @playwright/test au job (npx playwright test résout la spec).
        run: cd frontend && npm ci

      - name: Generate JWT keys
        run: bash setup-keys.sh

      - name: Build backend fat jar
        run: cd backend && mvn -B package -DskipTests -q

      - name: Start backend (Flyway + seed démo)
        working-directory: backend
        run: |
          # §G6.9 — AES-256 (32 octets base64) requis par CryptoService (démarrage) ;
          # dossier de fichiers non-root (FileStorageService par défaut /var/...).
          export ENCRYPTION_AES_KEY=$(openssl rand -base64 32)
          export DISCIPOLAT_FILE_STORAGE_ROOT=$RUNNER_TEMP/discipolat-files
          mkdir -p $DISCIPOLAT_FILE_STORAGE_ROOT
          JWT_PRIVATE_KEY_PATH=$GITHUB_WORKSPACE/keys/private.pem \
          JWT_PUBLIC_KEY_PATH=$GITHUB_WORKSPACE/keys/public.pem \
          nohup java -jar target/discipolat-backend-1.0.0.jar \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/discipolat \
            --spring.datasource.username=discipolat \
            --spring.datasource.password=discipolat_secret \
            --app.beta-testing.seed-demo-accounts=true > /tmp/backend-e2e.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 5
            [ "$i" = 90 ] && { tail -n 200 /tmp/backend-e2e.log; exit 1; }
          done

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run critical-path E2E
        working-directory: frontend
        run: npx playwright test

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-results
          path: |
            frontend/e2e/results.json
            frontend/test-results/

  # ── Security Audit ─────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: NPM Audit
        # npm audit lit le lockfile : aucune installation requise.
        run: cd frontend && npm audit --audit-level=high

      - name: Backend Dependency Check
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: OWASP Dependency Check
        run: |
          cd backend
          mvn -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=9 \
            -DsuppressionFile=.dependency-check-suppressions.xml

      - name: Upload Dependency-Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-report
          path: backend/target/dependency-check-report.html

  # ── Docker Build ───────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          cd backend
          docker build -t discipolat-backend:${{ github.sha }} .

      - name: Build Frontend Docker Image
        run: |
          cd frontend
          docker build -t discipolat-frontend:${{ github.sha }} .

  # ── Deploy (staging) ──────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend, frontend, mobile, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Backend
        run: echo "Deploy backend to staging..."

      - name: Deploy Frontend
        run: echo "Deploy frontend to staging..."

      - name: Notify
        run: echo "Deployment to staging complete"
