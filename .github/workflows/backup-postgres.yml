name: Backup PostgreSQL (DÉPRÉCIÉ — ne pas exécuter)

# ============================================================
# ⛔ DÉPRÉCIÉ depuis le passage des bases en plan starter + réseau
# interne uniquement (ipAllowList retirée de render.yaml).
#
# Raison : ce workflow se connectait via l'External Database URL,
# devenue inaccessible par conception (la base n'est plus joignable
# depuis Internet — c'était l'objectif). La sauvegarde de référence
# est désormais celle de Render : backups automatiques QUOTIDIENS
# du plan starter (Dashboard → Databases → Backups → Restore).
#
# Conserver ce fichier comme archive de la procédure de chiffrement
# des dumps ; ne réactiver un dump externe QUE vers un object
# storage chiffré côté client (R2/B2), jamais via une base ouverte.
#
# Contexte d'origine (plan Free, sans backup automatique) :
# - Export mensuel pg_dump EXTERNE (DEPLOYMENT.md §8.6 Option B),
#   chiffré AES-256 (openssl) AVANT upload en artifact GitHub (90 j).
# - Le dump contenait des DONNÉES PERSONNELLES (âmes, familles,
#   emails) et le dépôt est PUBLIC : ne jamais logger l'URL de la
#   base ni le contenu du dump.
#
# Déchiffrement d'un ancien artifact téléchargé :
#   export ENC_KEY="<passphrase>"
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
#     -pass env:ENC_KEY \
#     -in discipolat_db_YYYYMMDD.sql.enc -out discipolat_db_YYYYMMDD.sql
# ============================================================

on:
  workflow_dispatch: # désactivé en pratique : l'External URL n'existe plus

permissions:
  contents: read
  actions: write # requis pour upload-artifact@v4

concurrency:
  group: backup-postgres
  cancel-in-progress: false

jobs:
  backup:
    name: pg_dump + chiffrement + artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Vérifier les secrets
        env:
          DB_URL: ${{ secrets.RENDER_DB_URL }}
          ENC_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          [ -n "$DB_URL" ] || { echo "❌ Secret RENDER_DB_URL manquant"; exit 1; }
          [ -n "$ENC_KEY" ] || { echo "❌ Secret BACKUP_ENCRYPTION_KEY manquant"; exit 1; }
          echo "✅ Secrets présents"

      - name: Export pg_dump (PostgreSQL 16)
        env:
          DB_URL: ${{ secrets.RENDER_DB_URL }}
        run: |
          DATE=$(date +%Y%m%d)
          docker run --rm -e DB_URL="$DB_URL" postgres:16-alpine \
            sh -c 'pg_dump "$DB_URL" --no-owner --no-privileges' \
            > "discipolat_db_${DATE}.sql"
          # Vérification : le dump doit commencer par l'en-tête pg_dump
          head -1 "discipolat_db_${DATE}.sql" | grep -q "PostgreSQL database dump" \
            || { echo "❌ Dump invalide — vérifier l'External Database URL" ; exit 1; }
          echo "BACKUP_DATE=$DATE" >> "$GITHUB_ENV"
          echo "✅ Dump brut OK : discipolat_db_${DATE}.sql ($(du -h discipolat_db_${DATE}.sql | cut -f1))"

      - name: Chiffrer le dump (AES-256)
        env:
          ENC_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt \
            -pass env:ENC_KEY \
            -in "discipolat_db_${BACKUP_DATE}.sql" \
            -out "discipolat_db_${BACKUP_DATE}.sql.enc"
          # Suppression du fichier en clair : ne pas laisser de PII sur le runner
          rm "discipolat_db_${BACKUP_DATE}.sql"
          echo "✅ Chiffré : discipolat_db_${BACKUP_DATE}.sql.enc ($(du -h discipolat_db_${BACKUP_DATE}.sql.enc | cut -f1))"

      - name: Upload artifact (chiffré)
        uses: actions/upload-artifact@v4
        with:
          name: discipolat-db-backup-${{ env.BACKUP_DATE }}
          path: discipolat_db_*.sql.enc
          if-no-files-found: error
          retention-days: 90

      - name: Instructions de récupération
        run: |
          echo "✅ Backup disponible : onglet Actions → « Backup PostgreSQL (mensuel) »"
          echo "   → dernière run (verte) → section Artifacts (rétention 90 jours)"
          echo "   → télécharger puis déchiffrer (commande dans l'en-tête du workflow)"
          echo "   → stocker le fichier HORS de GitHub (NAS, disque chiffré…)"
