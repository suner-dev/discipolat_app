services:
  # ============================================
  # PostgreSQL — Base de données principale
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: discipolat-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discipolat}
      POSTGRES_USER: ${POSTGRES_USER:-discipolat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discipolat_secret}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-discipolat}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - discipolat-net

  # ============================================
  # Redis — Rate limiting distribué (Bucket4j)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: discipolat-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - discipolat-net

  # ============================================
  # Backend — Spring Boot API
  # ============================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: discipolat-api
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/discipolat
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-discipolat}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-discipolat_secret}
      REDIS_URL: redis://redis:6379
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
      MAIL_USERNAME: noreply@discipolat.com
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./keys:/app/keys:ro
    healthcheck:
      # /dev/tcp natif (pas besoin de curl dans l'image eclipse-temurin)
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - discipolat-net

  # ============================================
  # MailHog — Email de développement (SMTP factice)
  # ============================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: discipolat-mailhog
    ports:
      - "8026:8025"
      - "1026:1025"
    networks:
      - discipolat-net

  # ============================================
  # Frontend — React + Nginx (SPA)
  # ============================================
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: discipolat-web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - discipolat-net

  # ============================================
  # Nginx — Reverse proxy (optionnel si Render)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: discipolat-nginx
    # Apache2 système occupe :80 sur le host → mapping hôte :8086 (port libre).
    # Le tunnel cloudflared atteint nginx via le réseau docker interne (nginx:80),
    # donc le port hôte n'est PAS nécessaire pour le tunnel.
    ports:
      - "8086:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      # attendre que 'api' soit healthy (sinon "host not found in upstream api:8080")
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - discipolat-net

# ============================================
  # Cloudflared — Tunnel Cloudflare → Nginx (:80)
  # Expose TOUTE l'application via un seul tunnel.
  #
  #   MODE 1 (permanent) : si CLOUDFLARE_TUNNEL_TOKEN est défini dans .env
  #                        → tunnel NOMNÉ (config gérée dans Zero Trust dashboard,
  #                          hostname public → origin http://nginx:80).
  #   MODE 2 (rapide)     : sinon → tunnel trycloudflare SANS compte.
  #                        L'URL est affichée dans les logs :
  #                        docker logs discipolat-cloudflared
  #   --protocol http2    : contourne l'UDP/QUIC bloqué sur ce host (TCP forcé).
  # ============================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: discipolat-cloudflared
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    # ⚠️ Image distroless : PAS de /bin/sh → arguments passés DIRECTEMENT à
    # cloudflared (pas d'entrypoint script). --protocol http2 : contourne
    # l'UDP/QUIC bloqué sur ce host (TCP forcé).
    #
    #   MODE 1 (permanent) : CLOUDFLARE_TUNNEL_TOKEN défini dans .env
    #                        → remplacer command par :
    #                          ["tunnel", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]
    #   MODE 2 (rapide)     : sinon → tunnel trycloudflare SANS compte vers nginx.
    #                        L'URL est affichée dans : docker logs discipolat-cloudflared
    entrypoint: ["cloudflared", "--no-autoupdate", "--protocol", "http2"]
    command: ["tunnel", "--url", "http://nginx:80"]
    depends_on:
      - nginx
    networks:
      - discipolat-net

volumes:
  pgdata:
  redisdata:

networks:
  discipolat-net:
    driver: bridge
