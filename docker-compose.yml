services:
  db:
    image: postgres:16-alpine
    container_name: discipolat-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discipolat}
      POSTGRES_USER: ${POSTGRES_USER:-discipolat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discipolat_secret}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-discipolat}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: discipolat-api
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/discipolat
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-discipolat}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-discipolat_secret}
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
      MAIL_USERNAME: noreply@discipolat.com
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./keys:/app/keys:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: discipolat-mailhog
    ports:
      - "8026:8025"
      - "1026:1025"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: discipolat-web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: discipolat-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api

volumes:
  pgdata:
