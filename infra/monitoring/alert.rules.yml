groups:
  - name: discipolat-api
    interval: 30s
    rules:
      - alert: ApiDown
        expr: up{job=~"discipolat-api.*"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "API Discipolat injoignable ({{ $labels.job }})"
      - alert: High5xxRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m])) > 0.01
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Taux 5xx > 1% sur 5 min"
      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Latence p95 > 500ms sur 5 min"
      - alert: DbPoolSaturation
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Pool Hikari > 80% actif"
