# Prometheus Scrape Configuration
# Discipolat Backend Monitoring
# G6.9 : scrape local (api:8080 via compose) + règles d'alerte dédiées.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: 'discipolat-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['localhost:8080']
        labels:
          application: 'discipolat-api'
          env: 'production'

  - job_name: 'discipolat-api-compose'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api:8080']
        labels:
          application: 'discipolat-api'
          env: 'staging-local'

  - job_name: 'discipolat-api-docker'
    metrics_path: '/actuator/prometheus'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '.*discipolat.*'
        action: keep
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        target_label: container

