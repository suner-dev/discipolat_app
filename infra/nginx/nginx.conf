events {
    worker_connections 1024;
}

http {
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # HSTS (uncomment when HTTPS is enabled)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    upstream api {
        server api:8080;
    }

    upstream web {
        server web:80;
    }

    server {
        listen 80;
        server_name localhost;

        # API routes
        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Temps réel — WebSocket STOMP natif exposé par le backend sous /ws
        # (endpoint /ws-church, see messages/api/WebSocketConfig.java). Sans ce
        # bloc, la requête d'upgrade retombait sur `location /` -> conteneur web
        # (SPA) -> handshake 500 -> badge « Temps réel déconnecté ».
        # Le préfixe /ws couvre aussi /ws-church et les sous-chemins SockJS.
        location /ws {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Laisser les connexions longues vivre (sinon coupe ~60s).
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Swagger UI (webjar servi par le backend)
        location /swagger-ui/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # springdoc injecte dans swagger-initializer.js un `configUrl`
        # pointant sur /api/v1/api-docs/swagger-config (le contrôleur custom
        # ApiDocsController, protégé → 401 navigateur). L'UI charge donc ce
        # config, recoit un 401 et affiche « Failed to load remote
        # configuration », alors que la spec réelle est publiquement servie en
        # /api-docs (permitAll, voir SecurityConfig docker/dev). On ramène la
        # reference sur /api-docs par réécriture confinée à ce seul fichier JS.
        location = /swagger-ui/swagger-initializer.js {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Accept-Encoding "";
            sub_filter_types application/javascript text/javascript;
            sub_filter '/api/v1/api-docs' '/api-docs';
            sub_filter_once off;
        }

        # Spécification OpenAPI (springdoc.api-docs.path = /api-docs).
        # L'UI swagger (#1) charge sa spec via /api-docs/swagger-config puis
        # /api-docs ; sans ce bloc, nginx renvoyait l'index.html du SPA (le
        # point d'entrée `try_files … /index.html`) → « Unable to load API
        # definition » derrière le tunnel. Ces chemins sont `permitAll` côté
        # Spring sous profils dev/docker (SecurityConfig). Le routeur SPA
        # `/api-docs` reste joignable par navigation interne (client-side) ;
        # seule une recharge directe de ce chemin renvoie désormais la spec.

        # /api-docs/swagger-config : à l'exécution springdoc y annonce
        # `url`/`configUrl` = /api/v1/api-docs (le contrôleur métier custom
        # ApiDocsController, protégé PLATFORM_EXECUTE → 401 pour un navigateur
        # non authentifié), alors que la vraie spec openapi complete est servie
        # en /api-docs (permitAll). Ce décalage casse l'UI (#1 « Unable to load
        # API definition »). On réécrit UNIQUEMENT ce corps de config côté proxy
        # pour ramener le pointeur sur /api-docs. La spec elle-même (grosse, avec
        # des chemins /api/v1 légitimes) n'est jamais réécrite : sous_filter est
        # confiné à cette location exacte.
        location = /api-docs/swagger-config {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # sous_filter exige une réponse non compressée.
            proxy_set_header Accept-Encoding "";
            sub_filter_types application/json;
            sub_filter '/api/v1/api-docs' '/api-docs';
            sub_filter_once off;
        }

        location /api-docs {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Actuator - restrict in production
        location /actuator/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            # allow 127.0.0.1;
            # allow <monitoring-ip>;
            # deny all;
        }

        # PWA service worker - no cache
        location /sw.js {
            proxy_pass http://web;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Service-Worker-Allowed "/" always;
            expires -1;
        }

        # Frontend
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
