events {
    worker_connections 1024;
}

http {
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # HSTS (uncomment when HTTPS is enabled)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    upstream api {
        server api:8080;
    }

    upstream web {
        server web:80;
    }

    server {
        listen 80;
        server_name localhost;

        # API routes
        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Temps réel — WebSocket STOMP natif exposé par le backend sous /ws
        # (endpoint /ws-church, see messages/api/WebSocketConfig.java). Sans ce
        # bloc, la requête d'upgrade retombait sur `location /` -> conteneur web
        # (SPA) -> handshake 500 -> badge « Temps réel déconnecté ».
        # Le préfixe /ws couvre aussi /ws-church et les sous-chemins SockJS.
        location /ws {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Laisser les connexions longues vivre (sinon coupe ~60s).
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Swagger UI
        location /swagger-ui/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Actuator - restrict in production
        location /actuator/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            # allow 127.0.0.1;
            # allow <monitoring-ip>;
            # deny all;
        }

        # PWA service worker - no cache
        location /sw.js {
            proxy_pass http://web;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Service-Worker-Allowed "/" always;
            expires -1;
        }

        # Frontend
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
