# Pipeline GitLab CI — future SOURCE DE VÉRITÉ (ADR-001, arbitrage humain du 2026-10-09).
# Sens du miroir pendant la transition : on pousse TOUJOURS sur GitHub (lui seul déclenche Render
# aujourd'hui), et GitHub réplique vers GitLab (scripts/gitlab-mirror.sh). L'inversion n'a lieu
# qu'après 2 semaines sans incident de pipeline GitLab (GITLAB-BOOTSTRAP.md §4, ADR-008 §3.3).
#
# Traduction fidèle de `.github/workflows/ci.yml` (gate bloquante) ET de
# `.github/workflows/security.yml` (scans). Chaque job porte le nom de son équivalent GitHub
# pour qu'une comparaison de couverture se fasse ligne à ligne en revue de code.
#
# Ce qui N'EST PAS traduit ici, et pourquoi (à ne pas perdre de vue) :
#   - keep-alive.yml, backup-restore-test.yml, deploy-beta.yml : déclenchés par `schedule:`.
#     Les dupliquer sur GitLab les ferait partir DEUX FOIS. Ils restent sur GitHub tant que
#     GitHub est le miroir ; la bascule se fait par `gitlab-mirror.sh` puis suppression côté GitHub.
#   - actions/* (setup-java, upload-artifact, dependency-review) : mécaniques GitHub. Équivalents
#     GitLab : images officielles, `artifacts:`, et les jobs security:* ci-dessous (la DB
#     d'advisors GitHub n'existe pas sur GitLab : la couverture équivalente est npm audit +
#     dependency-check, puis Dependency-Scanning natif selon le palier).
#   - SAST/DAST/Dependency-Scanning natifs GitLab : nécessitent une licence Premium/Ultimate.
#     `include:` est donc commenté, avec la ligne à décommenter selon le palier réel.
#
# Correspondance exacte des étapes avec ci.yml (JDK 21 temurin, génération de clés RSA de test,
# mvn verify sous H2, gates Testcontainers PG, tsc/vitest/build, flutter analyze/test/apk).
#
# ATTENTION : la première exécution de ce fichier ne peut être validée qu'EN PIPELINE GitLab.
# Elle n'a pas été exécutée ici (aucun projet GitLab joignable sans jeton) — voir
# docs/architecture/GITLAB-BOOTSTRAP.md §3 pour la procédure de premier push et la grille de
# correction attendue.

include:
  # Secret-Detection est disponible sur tous les paliers (Core) : c'est le scan qui compte en
  # due-diligence. Les templates payants sont listés plus bas, commentés.
  - template: Security/Secret-Detection.gitlab-ci.yml

#  - template: Security/SAST.gitlab-ci.yml                    # Premium+
#  - template: Security/Dependency-Scanning.gitlab-ci.yml     # Premium+
#  - template: Security/SBOM.gitlab-ci.yml                    # Premium+

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG

default:
  interruptible: true

# ---------------------------------------------------------------- Self-validation du pipeline (V0.14)
# Les autres jobs **exécutent** ce fichier ; celui-ci le **vérifie** avant eux. Trois défauts
# bloquants ont survécu à plusieurs relectures humaines et ne se voient qu'en appliquant la
# sémantique GitLab au YAML (besoin absent d'une pipeline → pipeline non créée ; manuel sans
# allow_failure → pipeline `blocked` ; binaire absent de l'image → rouge au premier script) :
# `scripts/gitlab-ci-selfcheck.py` encode ces trois règles, avec la citation de la référence YAML
# en face de chacune. Hors ligne, aucune dépendance de service : la porte ne peut pas rougir pour
# une raison réseau (PyYAML est épinglé, voir la ligne de mesure dans le fichier même).
# Le stage `validate` était déclaré sans emploi depuis la traduction du 2026-10-09 : il sert.
ci:self-check:
  stage: validate
  image: python:3.12-slim
  needs: []
  rules:
    - changes: [ .gitlab-ci.yml, scripts/gitlab-ci-selfcheck.py ]
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    # Version épinglée et mesurée dans l'image du job le 2026-10-10 (pip 25.0.1, pyyaml 6.0.1).
    - python -m pip install --quiet --no-cache-dir pyyaml==6.0.1
  script:
    - python3 scripts/gitlab-ci-selfcheck.py --file .gitlab-ci.yml

# ------------------------------------------------------------------ Backend (H2, profil test)
backend:h2:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  services:
    - redis:7-alpine
  variables:
    REDIS_URL: redis://redis:6379
    JWT_PRIVATE_KEY_PATH: "$CI_PROJECT_DIR/keys/private.pem"
    JWT_PUBLIC_KEY_PATH: "$CI_PROJECT_DIR/keys/public.pem"
  cache:
    key: m2-$CI_COMMIT_REF_SLUG
    paths: [ .m2/repository ]
  rules:
    - changes: [ backend/**/*, backend/pom.xml, "**/*.sql" ]
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - mkdir -p keys
    - openssl genpkey -algorithm RSA -out keys/private.pem -pkeyopt rsa_keygen_bits:2048
    - openssl pkey -in keys/private.pem -pubout -out keys/public.pem
  script:
    - cd backend && mvn -B -Dmaven.repo.local="$CI_PROJECT_DIR/.m2/repository" verify
  artifacts:
    when: always
    expire_in: 14 days
    paths: [ backend/target/surefire-reports/ ]

# ---------------------------------------------------------- Backend gates PostgreSQL (Testcontainers)
backend:pg-gates:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  services:
    - docker:27-dind            # Testcontainers a besoin du démon Docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_RYUK_DISABLED: "true"
    JWT_PRIVATE_KEY_PATH: "$CI_PROJECT_DIR/keys/private.pem"
    JWT_PUBLIC_KEY_PATH: "$CI_PROJECT_DIR/keys/public.pem"
  cache:
    key: m2-$CI_COMMIT_REF_SLUG
    paths: [ .m2/repository ]
  rules:
    - changes: [ backend/**/*, "**/*.sql", backend/pom.xml ]
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - mkdir -p keys
    - openssl genpkey -algorithm RSA -out keys/private.pem -pkeyopt rsa_keygen_bits:2048
    - openssl pkey -in keys/private.pem -pubout -out keys/public.pem
  script:
    - cd backend && mvn -B -Dmaven.repo.local="$CI_PROJECT_DIR/.m2/repository" test
        -Dtest='FlywayMigrationChainPostgreSqlTest,EventTableContractTest'
  artifacts:
    when: always
    expire_in: 14 days
    paths: [ backend/target/surefire-reports/ ]

# ------------------------------------------------------------------------- Frontend (tsc/vitest/build)
frontend:
  stage: test
  image: node:23
  variables:
    VITE_API_URL: https://discipolat-api.onrender.com
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths: [ frontend/node_modules ]
  rules:
    - changes: [ frontend/**/* ]
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - cd frontend && npm ci
    - npx tsc --noEmit
    - npm run lint            # bloquant : le workflow GitHub impose 0 erreur
    - npm run i18n:audit      # ratchet de parité des clés i18n (6 locales)
    - npm run debt:audit      # ratchet de dette frontend (ne doit pas monter)
    - npx vitest run --reporter=default --reporter=junit --outputFile.junit=./test-results/junit.xml
    - npm run build
  artifacts:
    when: always
    expire_in: 14 days
    paths: [ frontend/test-results/ ]

# ---------------------------------------------------------------------------- Mobile (Flutter analyze/test/apk)
mobile:
  stage: test
  image: ghcr.io/cirruslabs/flutter:3.35.6     # image Flutter communautaire
  rules:
    - changes: [ mobile/**/*, mobile/pubspec.yaml, mobile/pubspec.lock ]
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - cd mobile && flutter pub get
    - flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos
    - flutter test --no-pub --file-reporter json:flutter-test-report.json
    - flutter build apk --debug --no-pub
  artifacts:
    when: always
    expire_in: 14 days
    paths: [ mobile/flutter-test-report.json ]

# ------------------------------------------------------------------------------- Build image backend
docker:backend:
  stage: build
  image: docker:27
  services: [ docker:27-dind ]
  needs: [ backend:h2, backend:pg-gates, frontend, mobile ]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # JAR reconstruit ici (le workspace n'a pas target/)
    - apk add --no-cache maven openjdk21 openssl
    - mkdir -p keys && openssl genpkey -algorithm RSA -out keys/private.pem -pkeyopt rsa_keygen_bits:2048
    - openssl pkey -in keys/private.pem -pubout -out keys/public.pem
    - cd backend && mvn -B package -DskipTests -q
    - docker build -t "$CI_REGISTRY_IMAGE/backend:latest" -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/backend:latest"
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"

# ------------------------------------------------------------------------ Déploiement Render (auto, main)
# Image EPINGLEE (8.13.0, tag vérifié auprès du registre le 2026-10-10) : le `latest` contredisait la
# règle que ce fichier s'impose ailleurs (« version épinglée exprès »). Outillage mesuré dans ce tag :
# curl, find, awk, apk — assez pour le script POSIX ci-dessous (aucun bashism).
deploy:render:
  stage: deploy
  image: curlimages/curl:8.13.0
  needs: [ docker:backend ]
  # L'enregistrement du déploiement (qui, quand, quelle SHA, réussi/échoué) est la matière première
  # des SLO, du rollback racontable et des métriques DORA. Sans `environment`, GitLab exécute le job
  # mais ne sait pas qu'il a déployé. Le nom `production` est protégé par défaut côté GitLab : si un
  # premier push échoue ici, c'est un réglage d'protected environment, pas un défaut de code.
  environment:
    name: production
    url: https://discipolat-beta-api.onrender.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - |
      if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_API_SERVICE_ID" ]; then
        echo "Secrets RENDER_API_KEY / RENDER_API_SERVICE_ID manquants (Settings → CI/CD → Variables)."; exit 1
      fi
      HTTP=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST \
        "https://api.render.com/v1/services/$RENDER_API_SERVICE_ID/deploys" \
        -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
        -d '{"clearCache":"do_not_clear"}')
      echo "Render HTTP $HTTP"; cat /tmp/r.json
      [ "$HTTP" = "201" ] || [ "$HTTP" = "202" ] || exit 1

# ------------------------------------------------------------------------- Rapport de taille (V0.2)
# Informatif par conception : le gate de V0.2 est « le job publie un rapport », pas « la dette
# est nulle ». Équivalent exact du job `report-size` de `.github/workflows/ci.yml` (mêmes scripts,
# mêmes artefacts), pour que la bascule GitLab ne change rien à la preuve produite.
# Image Ubuntu et non Alpine : les scripts s'appuient sur find/xargs GNU (-print0, -printf, lots),
# et une mesure qui change selon la distribution ne serait plus une mesure.
# V0.16 ajoute le palier de pilotage des couples R6 (`scripts/architecture-couples.sh`) : le
# classement est publié, il ne bloque pas. Seule `--check` bloque, et elle ne peut rougir que sur
# un gel impossible (0 couple, ligne mal formée, arête dupliquée, contexte sans dossier).
report:size:
  stage: report
  image: ubuntu:24.04
  needs: []
  rules:
    - changes: [ backend/**/*, frontend/**/*, mobile/**/*, scripts/report-size.sh,
                 scripts/architecture-couples.sh,
                 backend/src/test/resources/architecture/architecture-freeze.txt ]
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
  script:
    - bash scripts/report-size.sh --out reports/size-report.txt
    - bash scripts/architecture-couples.sh --check
    # --top 60 : au-dessus du nombre de couples (44 mesurés le 2026-10-10 dans l'image du job,
    # et la liste ne fait que décroître au fil de V0.15) — le gate V0.16 exige le classement
    # COMPLET, pas un extrait.
    - bash scripts/architecture-couples.sh --top 60 --out reports/couples-report.txt
    - head -n 24 reports/couples-report.txt
  artifacts:
    when: always
    expire_in: 30 days
    paths: [ reports/size-report.txt, reports/couples-report.txt ]

# ---------------------------------------------------- Scans de sécurité (traduit de security.yml)
security:npm-audit:
  stage: security
  image: node:23
  needs: []
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths: [ frontend/node_modules ]
  rules:
    - changes: [ frontend/package.json, frontend/package-lock.json ]
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - cd frontend && npm ci --ignore-scripts
    - npm audit --audit-level=high        # bloquant, comme le workflow GitHub

security:bandit:
  stage: security
  image: python:3.12-slim
  needs: []
  rules:
    - changes: [ "scripts/**/*", "performance-tests/**/*" ]
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - python -m pip install --quiet bandit
  script:
    # Deux temps, identiques à security.yml : rapport complet non bloquant (tous les niveaux,
    # lisible dans la trace), puis la porte sur la sévérité HIGH seule.
    - bandit -q -r scripts/ performance-tests/ -f txt || true
    - bandit -q -r scripts/ performance-tests/ -f txt -ll

security:owasp-backend:
  stage: security
  image: maven:3.9-eclipse-temurin-21
  needs: []
  # NON BLOQUANT, et ce n'est pas de la complaisance : sans clé NVD, le débit gratuit fait
  # échouer le téléchargement de la base de façon aléatoire. Une porte aléatoire n'est pas une
  # porte. La porte bloquante côté dépendances est security:npm-audit + le scan natif
  # Dependency-Scanning dès que le palier GitLab le permet. Cf. backend/pom.xml et KNOWN_ISSUES.md Q7.
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [ backend/pom.xml, backend/.dependency-check-suppressions.xml ]
    - when: manual
      allow_failure: true
  cache:
    key: m2-$CI_COMMIT_REF_SLUG
    paths: [ .m2/repository ]
  script:
    - cd backend && mvn -B -Dmaven.repo.local="$CI_PROJECT_DIR/.m2/repository"
        org.owasp:dependency-check-maven:check
        -DfailBuildOnCVSS=7
        -DsuppressionFile=.dependency-check-suppressions.xml
  artifacts:
    when: always
    expire_in: 14 days
    paths: [ backend/target/dependency-check-report.html ]

# ------------------------------------------------------------------------ SBOM par release (ADR-008 §4)
# DEUX jobs, pas un : la version du 2026-10-09 faisait le backend ET le frontend dans l'image
# Maven. Mesure en conteneur (`docker run --rm --entrypoint sh maven:3.9-eclipse-temurin-21 -c
# 'command -v npm'`) : npm y est ABSENT — le `npm ci` du frontend échouait donc dès le premier run.
# La « preuve d'exécution » du 2026-10-09 avait été faite sur LE POSTE (qui a node), pas dans
# L'IMAGE DU JOB : c'est exactement la classe de défaut que `scripts/gitlab-ci-selfcheck.py`
# (stage `validate`, ci-dessus) bloque désormais.
# Data room automatique : chaque release porte sa liste de composants. Fait ICI à la main (et non
# par `template: Security/SBOM`) parce que le template natif exige un palier Premium/Ultimate : la
# preuve ne doit pas dépendre du niveau d'abonnement.
# NON BLOQUANT au départ : la génération résout les dépendances depuis le réseau, un échec de
# résolution n'est pas un défaut de code. À rendre bloquant dès le premier vert observé en pipeline
# (modifier `allow_failure` en une ligne) — c'est le seul changement de porte prévu ici.
sbom:backend:
  stage: security
  image: maven:3.9-eclipse-temurin-21
  needs: []
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - when: manual
      allow_failure: true
  cache:
    key: m2-$CI_COMMIT_REF_SLUG
    paths: [ .m2/repository ]
  script:
    # Version épinglée exprès : un SBOM régénéré six mois plus tard doit donner la même liste.
    - cd backend && mvn -B -DskipTests -Dmaven.repo.local="$CI_PROJECT_DIR/.m2/repository"
        org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
        -DoutputFormat=json -DoutputName=bom
    - cp "$(find backend/target -name 'bom*.json' | head -1)" sbom-backend.json
    - ls -l sbom-backend.json
    # Outillage vérifié dans l'image du job le 2026-10-10 (mvn 3.9.16, JDK 21.0.12, find, awk).
    # Mesure hors conteneur du 2026-10-09, même version épinglée : 244 composants, CycloneDX 1.6,
    # BUILD SUCCESS en 28 s.
  artifacts:
    when: always
    expire_in: 30 days
    paths: [ sbom-backend.json ]

sbom:frontend:
  stage: security
  image: node:23              # outillage mesure dans cette image : node, npm, npx, git, python3
  needs: []
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - when: manual
      allow_failure: true
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths: [ frontend/node_modules ]
  script:
    # --package-lock-only (et non --ignore-scripts, qui n'existe plus dans cyclonedx-npm v6) :
    # le SBOM se construit depuis le verrou, donc sans évaluer un arbre installé.
    - cd frontend && npm ci --ignore-scripts
    - npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --package-lock-only --output-file ../sbom-frontend.json
    - cd .. && ls -l sbom-frontend.json
    # Mesure du 2026-10-09 (même version épinglée) : 407 composants, CycloneDX 1.6.
  artifacts:
    when: always
    expire_in: 30 days
    paths: [ sbom-frontend.json ]

# ------------------------------------------------------------------- Scan de l'image produite (ADR-008 §4)
# Le build pousse une image, personne ne la regardait : c'est la surface réellement exposée.
# NON BLOQUANT au départ, pour la même raison que le SBOM (liste de CVE sans ligne de base =
# rouge que l'on apprend à ignorer). La porte future : `--exit-code 1 --severity CRITICAL` une fois
# la liste connue et les suppressions écrites.
scan:image:
  stage: report            # le scan consomme l'image produite par `docker:backend` (stage `build`) :
                           # placer le job dans un stage POSTÉRIEUR rend la dépendance vraie sans
                           # s'en remettre à la sémantique DAG inter-stages, que je n'ai pas vérifiée
                           # en pipeline réel
  image: aquasec/trivy:0.75.0
  # `optional: true` : dans la pipeline d'un TAG, `docker:backend` n'est pas créé (sa règle cible
  # la branche main). Sans l'option, la référence YAML est formelle — « If a needed job has
  # optional: false, but it was not added to the pipeline, the pipeline fails to create » — donc
  # chaque release aurait échoué à la CRÉATION de la pipeline, avant même le premier script.
  # L'image scannée a été poussée par la pipeline de `main` sur le MEMME SHA (le tag est posé sur
  # main), donc la référence reste valide ; si elle manquait, Trivy le dit dans le log.
  needs:
    - job: docker:backend
      optional: true
  allow_failure: true
  variables:
    TRIVY_USERNAME: gitlab-ci-token
    TRIVY_PASSWORD: $CI_JOB_TOKEN
    TRIVY_CACHE_DIR: /tmp/trivy-cache
    TRIVY_SEVERITY: CRITICAL,HIGH
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  script:
    - trivy image --format table "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"

# ------------------------------------------------------------------ E2E et charge (manuels, actifs)
e2e:playwright:
  stage: test
  # Version = celle de e2/package-lock.json (@playwright/test 1.63.0), et pas une autre : ces images
  # embarquent les navigateurs À LA RÉVISION DU TAG. Mesure en conteneur du 2026-10-10 avec l'ancienne
  # valeur (v1.49.0-jammy) et le lock à 1.63.0 : `npx playwright test` échoue sur
  # « Executable doesn't exist at /ms-playwright/chromium_headless_shell-1243/… » puis
  # « Looks like Playwright was just updated to 1.63.0. Please update docker image as well. »
  # Le job ne fait pas `playwright install` (il se fie à l'image), donc le tag porte la révision de
  # navigateur attendue. `scripts/gitlab-ci-selfcheck.py` (S9) vérifie ce couplage par une machine.
  image: mcr.microsoft.com/playwright:v1.63.0-jammy
  needs: []
  # Manuel : la suite ne s'active qu'à la première spec déposée dans e2/specs/, et son déclenchement
  # automatique sur chaque MR coûterait un run contre un environnement beta partagé.
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  variables:
    E2E_BASE_URL: https://discipolat-beta.onrender.com
  script:
    - cd e2
    - |
      count=$(find specs -name '*.spec.ts' 2>/dev/null | wc -l)
      if [ "$count" -eq 0 ]; then
        echo "Aucune spec e2e déposée — le job passe en mode attente (parité avec e2.yml)."
        exit 0
      fi
    - if [ -f package-lock.json ]; then npm ci; else npm install; fi
    - npx playwright test
  artifacts:
    when: always
    expire_in: 14 days
    paths: [ e2/playwright-report/ ]

performance:k6:
  stage: test
  image: ubuntu:24.04          # et non grafana/k6 : l'image k6 n'a pas python3, et c'est
                               # python3 qui lit le summary pour la porte (parité avec perf.yml)
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      # allow_failure: true est OBLIGATOIRE ici, et c'est écrit dans la référence YAML :
      # « When using rules:when: manual to add a manual job: allow_failure becomes false by
      # default ». Sans cette ligne, k6 était un job manuel BLOQUANT dans le stage `test` : la
      # pipeline restait `blocked`, security/build/deploy ne partaient pas, et toute merge était
      # impossible tant que `finalize` pose only_allow_merge_if_pipeline_succeeds. Parité avec
      # `e2e:playwright`, qui avait déjà cette ligne.
      allow_failure: true
  variables:
    BASE_URL: https://discipolat-beta-api.onrender.com
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends
        curl ca-certificates gnupg python3 coreutils
    - mkdir -m 755 -p /etc/apt/keyrings
    - curl -fsSL https://dl.k6.io/key.gpg | gpg --dearmor -o /etc/apt/keyrings/k6.gpg
    - echo "deb [signed-by=/etc/apt/keyrings/k6.gpg] https://dl.k6.io/deb stable main"
        > /etc/apt/sources.list.d/k6-stable.list
    - apt-get update -qq && apt-get install -y -qq k6
    - k6 version
  script:
    - |
      if [ -z "$PERF_JWT_TOKEN" ]; then
        echo "Variable PERF_JWT_TOKEN absente : générer un jeton admin sur la cible" >&2
        echo "(POST /api/v1/auth/login) puis Settings → CI/CD → Variables." >&2
        exit 1
      fi
      echo "Cible : $BASE_URL"
    - |
      # pipefail : sans ça, `| tee` avalerait le code de sortie de k6 (k6 sort en 99 quand un
      # seuil casse) et le job serait faux vert.
      set -o pipefail
      k6 run performance-tests/k6-ci-gate.js --summary-export=k6-summary.json 2>&1 | tee k6-run.log
    - |
      if [ ! -f k6-summary.json ]; then
        echo "k6 n'a pas produit de summary (échec du run lui-même)." >&2
        exit 1
      fi
      python3 - <<'PY'
      import json, sys
      with open('k6-summary.json') as f:
          s = json.load(f)
      p95 = s['metrics']['http_req_duration']['values']['p(95)']
      failed = s['metrics'].get('http_req_failed', {}).get('values', {}).get('rate')
      print(f"P95 = {p95:.1f} ms  (porte : < 2000 ms)")
      print(f"taux d'erreurs HTTP = {failed}")
      if p95 > 2000:
          print(f"P95 {p95:.0f} ms > 2000 ms — porte de latence franchie.")
          sys.exit(1)
      print("Porte de latence OK.")
      PY
  artifacts:
    when: always
    expire_in: 14 days
    paths: [ k6-summary.json ]

stages: [ validate, test, security, build, report, deploy ]
