# Discipolat — Frontend Nginx Configuration
# 
# ⚠️ En production (Render), le frontend appelle l'API directement
# via VITE_API_URL (https://discipolat-api.onrender.com).
# Le bloc location /api/ est utilisé uniquement en local
# avec Docker Compose pour le proxy vers le backend.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ============================================
    # Security Headers
    # ============================================
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.onrender.com; frame-ancestors 'none';" always;

    # ============================================
    # API Proxy (local Docker Compose only)
    # ============================================
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI (local only)
    location /swagger-ui/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # ============================================
    # SPA — fallback to index.html for client-side routing
    # ============================================
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ============================================
    # Static assets — long-term caching
    # ============================================
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ============================================
    # Service Worker — no cache (PWA)
    # ============================================
    location /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        expires -1;
    }
}
