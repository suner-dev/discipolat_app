apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: discipolat-backend-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: discipolat
  source:
    repoURL: https://gitlab.com/discipolat/backend.git
    targetRevision: main
    path: helm/discipolat-backend
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml
      parameters:
        - name: image.tag
          value: "{{.ARGOCD_APP_SOURCE_TARGET_REVISION}}"
        - name: replicaCount
          value: "6"
        - name: resources.limits.memory
          value: "4Gi"
        - name: resources.limits.cpu
          value: "4000m"
        - name: autoscaling.enabled
          value: "true"
        - name: autoscaling.minReplicas
          value: "6"
        - name: autoscaling.maxReplicas
          value: "20"
        - name: otel.exporter.endpoint
          value: "https://otel-collector.observability:4317"
        - name: vault.enabled
          value: "true"
        - name: vault.role
          value: "backend-production"
  destination:
    server: https://kubernetes.default.svc
    namespace: discipolat-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
---
