stages:
  - validate
  - security
  - build
  - test
  - deploy-staging
  - deploy-production

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  HELM_VERSION: "3.15.0"
  KUBECTL_VERSION: "1.29.0"
  ARGOCD_VERSION: "2.10.0"
  VAULT_VERSION: "1.17.0"
  TERRAFORM_VERSION: "1.9.0"
  OPENTELEMETRY_COLLECTOR_VERSION: "0.112.0"

  REGISTRY: $CI_REGISTRY
  IMAGE_PREFIX: $CI_REGISTRY_IMAGE
  KUBE_CONTEXT_STAGING: "discipolat-staging"
  KUBE_CONTEXT_PRODUCTION: "discipolat-production"
  VAULT_ADDR: "https://vault.discipolat.internal"
  VAULT_ROLE: "gitlab-ci"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

.validate-template: &validate-template
  stage: validate
  image: alpine:3.20
  before_script:
    - apk add --no-cache yamllint jq curl
  script:
    - |
      echo "Validating YAML files..."
      find . -name "*.yaml" -o -name "*.yml" | xargs yamllint -d "{extends: relaxed, rules: {line-length: disable}}"
    - |
      echo "Validating Helm charts..."
      for chart in helm/*/Chart.yaml; do
        helm lint "$(dirname "$chart")" --strict
      done
    - |
      echo "Validating Kustomize overlays..."
      for overlay in kustomize/overlays/*/; do
        kustomize build "$overlay" > /dev/null
      done
    - |
      echo "Validating ArgoCD Applications..."
      find argocd/applications -name "*.yaml" | xargs -I {} kubectl apply --dry-run=client -f {}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.security-scan: &security-scan
  stage: security
  image: aquasec/trivy:0.54
  variables:
    TRIVY_DB_REPOSITORY: "ghcr.io/aquasecurity/trivy-db:2"
    TRIVY_JAVA_DB_REPOSITORY: "ghcr.io/aquasecurity/trivy-java-db:1"
  before_script:
    - trivy version
  script:
    - |
      echo "Scanning filesystem for vulnerabilities..."
      trivy fs --scanners vuln,secret,config --severity HIGH,CRITICAL --exit-code 1 --format sarif -o trivy-results.sarif .
    - |
      echo "Scanning container images..."
      for img in "$BACKEND_IMAGE" "$FRONTEND_IMAGE" "$MOBILE_IMAGE"; do
        trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$img" || true
      done
  artifacts:
    reports:
      sast: trivy-results.sarif
    expire_in: 30d
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

terraform-validate:
  <<: *validate-template
  stage: validate
  image: hashicorp/terraform:1.9
  script:
    - terraform fmt -check -recursive terraform/
    - terraform init -backend=false terraform/
    - terraform validate terraform/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

helm-validate:
  <<: *validate-template
  stage: validate
  image: alpine/helm:3.15
  script:
    - for chart in helm/*/; do helm lint "$chart" --strict; done
    - helm dependency update helm/discipolat-platform
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

kustomize-validate:
  <<: *validate-template
  stage: validate
  image: alpine:3.20
  before_script:
    - apk add --no-cache kustomize
  script:
    - for overlay in kustomize/overlays/*/; do kustomize build "$overlay" > /dev/null; done
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

argocd-validate:
  <<: *validate-template
  stage: validate
  image: bitnami/kubectl:1.29
  script:
    - find argocd/applications -name "*.yaml" | xargs -I {} kubectl apply --dry-run=client -f {}
    - argocd app lint argocd/applications/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

security-scan-fs:
  <<: *security-scan
  stage: security

security-scan-container:
  <<: *security-scan
  stage: security
  variables:
    BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend:latest"
    FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend:latest"
    MOBILE_IMAGE: "$CI_REGISTRY_IMAGE/mobile:latest"

terraform-plan:
  stage: build
  image: hashicorp/terraform:1.9
  before_script:
    - terraform -version
    - cd terraform/
    - terraform init -upgrade
  script:
    - terraform plan -out=tfplan -var="environment=staging" -var="image_tag=$CI_COMMIT_SHA"
  artifacts:
    reports:
      terraform: tfplan
    paths:
      - tfplan
    expire_in: 1h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

helm-package:
  stage: build
  image: alpine/helm:3.15
  script:
    - helm dependency update helm/discipolat-platform
    - helm package helm/discipolat-platform -d dist/
    - helm package helm/discipolat-backend -d dist/
    - helm package helm/discipolat-frontend -d dist/
    - helm package helm/discipolat-mobile -d dist/
  artifacts:
    paths:
      - dist/*.tgz
    expire_in: 1h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

helm-test:
  stage: test
  image: alpine/helm:3.15
  before_script:
    - helm plugin install https://github.com/helm-unittest/helm-unittest
  script:
    - helm unittest helm/discipolat-platform
    - helm unittest helm/discipolat-backend
    - helm unittest helm/discipolat-frontend
    - helm unittest helm/discipolat-mobile
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

kustomize-test:
  stage: test
  image: alpine:3.20
  before_script:
    - apk add --no-cache kustomize kubeconform
  script:
    - for overlay in kustomize/overlays/*/; do kustomize build "$overlay" | kubeconform -strict -summary; done
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-staging:
  stage: deploy-staging
  image: bitnami/kubectl:1.29
  environment:
    name: staging
    url: https://staging.discipolat.com
  before_script:
    - kubectl config use-context $KUBE_CONTEXT_STAGING
    - argocd login $ARGOCD_SERVER --auth-token $ARGOCD_TOKEN --insecure
  script:
    - |
      echo "Deploying to Staging via ArgoCD..."
      for app in argocd/applications/staging/*.yaml; do
        argocd app sync "$(basename "$app" .yaml)" --prune --auto-prune --timeout 300
      done
    - |
      echo "Waiting for sync to complete..."
      for app in argocd/applications/staging/*.yaml; do
        argocd app wait "$(basename "$app" .yaml)" --timeout 600
      done
    - |
      echo "Running post-deploy smoke tests..."
      ./scripts/smoke-tests-staging.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  timeout: 30m

deploy-production:
  stage: deploy-production
  image: bitnami/kubectl:1.29
  environment:
    name: production
    url: https://discipolat.com
  before_script:
    - kubectl config use-context $KUBE_CONTEXT_PRODUCTION
    - argocd login $ARGOCD_SERVER --auth-token $ARGOCD_TOKEN --insecure
  script:
    - |
      echo "Deploying to Production via ArgoCD (manual approval required)..."
      read -p "Confirm production deployment? (yes/no): " confirm
      if [ "$confirm" != "yes" ]; then
        echo "Deployment cancelled"
        exit 1
      fi
    - |
      for app in argocd/applications/production/*.yaml; do
        argocd app sync "$(basename "$app" .yaml)" --prune --auto-prune --timeout 300
      done
    - |
      for app in argocd/applications/production/*.yaml; do
        argocd app wait "$(basename "$app" .yaml)" --timeout 600
      done
    - |
      echo "Running post-deploy smoke tests..."
      ./scripts/smoke-tests-production.sh
    - |
      echo "Creating deployment marker..."
      kubectl annotate namespace discipolat-production \
        deployment.discipolat.com/last-deploy="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        deployment.discipolat.com/sha="$CI_COMMIT_SHA" \
        deployment.discipolat.com/version="$CI_COMMIT_TAG" --overwrite
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  when: manual
  timeout: 45m

rollback-production:
  stage: deploy-production
  image: bitnami/kubectl:1.29
  environment:
    name: production
  before_script:
    - kubectl config use-context $KUBE_CONTEXT_PRODUCTION
    - argocd login $ARGOCD_SERVER --auth-token $ARGOCD_TOKEN --insecure
  script:
    - |
      echo "Rolling back production deployment..."
      for app in argocd/applications/production/*.yaml; do
        argocd app rollback "$(basename "$app" .yaml)" --revision $(($(argocd app get "$(basename "$app" .yaml)" -o json | jq '.status.sync.revision') - 1))
      done
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  when: manual
  timeout: 15m

.opentelemetry-collector-config: &otel-config
  image: otel/opentelemetry-collector-contrib:0.112
  variables:
    OTLP_ENDPOINT: "https://otel-collector.discipolat.internal:4317"
    OTEL_EXPORTER_OTLP_ENDPOINT: "https://otel-collector.discipolat.internal:4317"
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "https://otel-collector.discipolat.internal:4317/v1/traces"
    OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "https://otel-collector.discipolat.internal:4317/v1/metrics"
    OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "https://otel-collector.discipolat.internal:4317/v1/logs"

otel-collector-deploy:
  <<: *otel-config
  stage: deploy-staging
  script:
    - helm upgrade --install opentelemetry-collector ./helm/opentelemetry-collector \
        --namespace observability --create-namespace \
        --set mode=daemonset \
        --set config.exporters.otlp.endpoint=$OTLP_ENDPOINT \
        --set config.exporters.otlp.tls.insecure=false \
        --set config.service.pipelines.traces.exporters[0]=otlp \
        --set config.service.pipelines.metrics.exporters[0]=otlp \
        --set config.service.pipelines.logs.exporters[0]=otlp \
        --wait --timeout 300s
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

otel-instrumentation-validate:
  <<: *otel-config
  stage: validate
  script:
    - |
      echo "Validating OpenTelemetry instrumentation configs..."
      for lang in java nodejs dart; do
        if [ -f "instrumentation/$lang/otel-config.yaml" ]; then
          kubeconform -strict "instrumentation/$lang/otel-config.yaml"
        fi
      done
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

vault-secrets-sync:
  stage: deploy-staging
  image: hashicorp/vault:1.17
  variables:
    VAULT_ADDR: "https://vault.discipolat.internal"
    VAULT_NAMESPACE: "discipolat"
  before_script:
    - vault login -method=jwt role=$VAULT_ROLE jwt=$CI_JOB_JWT
  script:
    - |
      echo "Syncing secrets from Vault to Kubernetes..."
      vault kv get -format=json secret/discipolat/staging/backend | jq -r '.data.data | to_entries[] | "\(.key)=\(.value)"' > backend-secrets.env
      vault kv get -format=json secret/discipolat/staging/frontend | jq -r '.data.data | to_entries[] | "\(.key)=\(.value)"' > frontend-secrets.env
      vault kv get -format=json secret/discipolat/staging/mobile | jq -r '.data.data | to_entries[] | "\(.key)=\(.value)"' > mobile-secrets.env
    - |
      kubectl create secret generic discipolat-backend-secrets \
        --from-env-file=backend-secrets.env \
        --namespace=discipolat-staging --dry-run=client -o yaml | kubectl apply -f -
      kubectl create secret generic discipolat-frontend-secrets \
        --from-env-file=frontend-secrets.env \
        --namespace=discipolat-staging --dry-run=client -o yaml | kubectl apply -f -
      kubectl create secret generic discipolat-mobile-secrets \
        --from-env-file=mobile-secrets.env \
        --namespace=discipolat-staging --dry-run=client -o yaml | kubectl apply -f -
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

vault-secrets-sync-prod:
  stage: deploy-production
  image: hashicorp/vault:1.17
  variables:
    VAULT_ADDR: "https://vault.discipolat.internal"
    VAULT_NAMESPACE: "discipolat"
  before_script:
    - vault login -method=jwt role=$VAULT_ROLE jwt=$CI_JOB_JWT
  script:
    - |
      echo "Syncing production secrets from Vault..."
      vault kv get -format=json secret/discipolat/production/backend | jq -r '.data.data | to_entries[] | "\(.key)=\(.value)"' > backend-secrets.env
      vault kv get -format=json secret/discipolat/production/frontend | jq -r '.data.data | to_entries[] | "\(.key)=\(.value)"' > frontend-secrets.env
      vault kv get -format=json secret/discipolat/production/mobile | jq -r '.data.data | to_entries[] | "\(.key)=\(.value)"' > mobile-secrets.env
    - |
      kubectl create secret generic discipolat-backend-secrets \
        --from-env-file=backend-secrets.env \
        --namespace=discipolat-production --dry-run=client -o yaml | kubectl apply -f -
      kubectl create secret generic discipolat-frontend-secrets \
        --from-env-file=frontend-secrets.env \
        --namespace=discipolat-production --dry-run=client -o yaml | kubectl apply -f -
      kubectl create secret generic discipolat-mobile-secrets \
        --from-env-file=mobile-secrets.env \
        --namespace=discipolat-production --dry-run=client -o yaml | kubectl apply -f -
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  when: manual
  timeout: 10m

notify-slack:
  stage: deploy-production
  image: curlimages/curl:8.8
  script:
    - |
      if [ "$CI_JOB_STATUS" == "success" ]; then
        COLOR="good"
        TEXT="✅ Deployment to *Production* succeeded for $CI_PROJECT_NAME@$CI_COMMIT_SHA"
      else
        COLOR="danger"
        TEXT="❌ Deployment to *Production* failed for $CI_PROJECT_NAME@$CI_COMMIT_SHA"
      fi
      curl -X POST -H 'Content-type: application/json' \
        --data "{\"attachments\":[{\"color\":\"$COLOR\",\"text\":\"$TEXT\",\"fields\":[{\"title\":\"Pipeline\",\"value\":\"$CI_PIPELINE_URL\",\"short\":true},{\"title\":\"Commit\",\"value\":\"$CI_COMMIT_SHA\",\"short\":true}]}]}" \
        $SLACK_WEBHOOK_URL
  when: always
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

notify-teams:
  stage: deploy-production
  image: curlimages/curl:8.8
  script:
    - |
      if [ "$CI_JOB_STATUS" == "success" ]; then
        THEME_COLOR="0078D7"
        TEXT="✅ Deployment to Production succeeded"
      else
        THEME_COLOR="FF0000"
        TEXT="❌ Deployment to Production failed"
      fi
      curl -X POST -H 'Content-type: application/json' \
        --data "{\"@type\":\"MessageCard\",\"@context\":\"http://schema.org/extensions\",\"themeColor\":\"$THEME_COLOR\",\"summary\":\"$TEXT\",\"sections\":[{\"activityTitle\":\"$TEXT\",\"facts\":[{\"name\":\"Project\",\"value\":\"$CI_PROJECT_NAME\"},{\"name\":\"Pipeline\",\"value\":\"$CI_PIPELINE_URL\"},{\"name\":\"Commit\",\"value\":\"$CI_COMMIT_SHA\"},{\"name\":\"Branch\",\"value\":\"$CI_COMMIT_REF_NAME\"}]}]}" \
        $TEAMS_WEBHOOK_URL
  when: always
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/