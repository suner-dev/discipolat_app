# Discipolat — Render Blueprint
# Spec : https://render.com/docs/blueprint-spec
#
# Règles appliquées (erreurs Render corrigées) :
#   • `databases:` = clé racine, champs name/plan/region/databaseName/user/
#     postgresMajorVersion/ipAllowList. Le champ `version` n'existe pas.
#   • Redis/Key Value = service `type: keyvalue` dans `services:`,
#     `ipAllowList` OBLIGATOIRE. `ipAllowList: []` = réseau interne seul
#     (l'API s'y connecte en Render Private Network, jamais en public).
#   • `fromService` vers un Key Value : `type: keyvalue` +
#     `property: connectionString` (format redis://…).

databases:
  # ── Base de données BÊTA (isolée de la prod) ──────────────────────────────
  - name: discipolat-beta-db
    databaseName: discipolat_beta
    user: discipolat_beta
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"
    # Connexions externes interdites : seule l'API Render (réseau privé) parle
    # à la base. Ni psql depuis un laptop, ni scan depuis Internet.
    ipAllowList: []

services:
  # ══════════════════════════════════════════════════════════════════════════
  # Key Value (ex-Redis) — rate limiting distribué
  # ══════════════════════════════════════════════════════════════════════════
  - type: keyvalue
    name: discipolat-redis
    region: frankfurt
    plan: free
    maxmemoryPolicy: allkeys-lru
    # OBLIGATOIRE pour un Key Value. Liste vide = réseau privé uniquement,
    # ce qui est le bon choix ici : Bucket4j n'a besoin que du réseau interne.
    ipAllowList: []

  # ══════════════════════════════════════════════════════════════════════════
  # API backend — image Docker pré-construite sur GHCR
  # ══════════════════════════════════════════════════════════════════════════
  - type: web
    name: discipolat-beta-api
    # Build from source, not from a prebuilt image: no dependency on the CI
    # having pushed to GHCR first. Requires repo+branch (the sources) and must
    # NOT declare `image:` — the spec forbids both at once.
    runtime: docker
    repo: https://github.com/suner-dev/discipolat_app
    branch: main
    dockerfilePath: ./backend/Dockerfile
    # Build context is ./backend so that the Dockerfile's COPY pom.xml / COPY src
    # resolve inside backend/, not at the repository root.
    dockerContext: ./backend
    region: frankfurt
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: beta
      - key: APP_ENVIRONMENT
        value: beta
      - key: APP_VERSION
        value: 1.1.0

      # Base : reference dynamique aux secrets gérés par Render
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: discipolat-beta-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: discipolat-beta-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: discipolat-beta-db
          property: password

      # Rate limiting : format redis://red-xxx:6379
      - key: REDIS_URL
        fromService:
          name: discipolat-redis
          type: keyvalue
          property: connectionString

      # ── Secrets : saisis dans le Dashboard Render après Apply ──────────────
      # `sync: false` = Render affiche « Prompt for value », rien n'est
      # committé. DEMO_PASSWORD est obligatoire : la garde fail-closed de
      # DataInitializer refuse de démarrer si elle vaut encore `password123`
      # sur un service exposé (protection E3 — voir KNOWN_ISSUES.md).
      - key: DEMO_PASSWORD
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: ENCRYPTION_AES_KEY
        sync: false
      - key: PAYMENTS_WEBHOOK_SECRET
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

      # CORS + liens d'email → le frontend bêta
      - key: FRONTEND_URL
        value: https://discipolat-beta.onrender.com
      - key: FRONTEND_URL_BASE
        value: https://discipolat-beta.onrender.com
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: framework

      # ── Connexion par identité externe (désactivée par défaut) ────────────
      - key: SOCIAL_GOOGLE_ENABLED
        value: "false"
      - key: SOCIAL_GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: SOCIAL_GOOGLE_ANDROID_CLIENT_ID
        sync: false
      - key: SOCIAL_GOOGLE_IOS_CLIENT_ID
        sync: false
      - key: SOCIAL_MICROSOFT_ENABLED
        value: "false"
      - key: SOCIAL_MICROSOFT_CLIENT_ID
        sync: false
      - key: SOCIAL_MICROSOFT_TENANT_ID
        value: common
      - key: SOCIAL_FACEBOOK_ENABLED
        value: "false"
      - key: SOCIAL_FACEBOOK_APP_ID
        sync: false
      - key: SOCIAL_ALLOW_ACCOUNT_LINKING
        value: "true"
      - key: SOCIAL_REQUIRE_VERIFIED_EMAIL
        value: "true"

  # ══════════════════════════════════════════════════════════════════════════
  # Frontend React — Static Site (CDN mondial, jamais endormi)
  # ══════════════════════════════════════════════════════════════════════════
  - type: web
    name: discipolat-beta
    runtime: static
    repo: https://github.com/suner-dev/discipolat_app
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22.15.1"
      # Évite le double `npm ci` (Render n'installe pas, le buildCommand gère).
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_API_URL
        value: https://discipolat-beta-api.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_MICROSOFT_CLIENT_ID
        sync: false
      - key: VITE_MICROSOFT_TENANT_ID
        value: common
      - key: VITE_FACEBOOK_APP_ID
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains; preload"
      - path: /
        name: Cache-Control
        value: "public, max-age=0, must-revalidate"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://www.facebook.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.onrender.com https://accounts.google.com https://login.microsoftonline.com https://www.facebook.com; frame-src 'self' https://accounts.google.com https://www.facebook.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';"
    # Fallback SPA : react-router résout toutes les routes via index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
