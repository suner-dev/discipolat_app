name: discipolat_mobile
description: Application mobile de gestion du discipolat
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Navigation
  go_router: ^14.6.2
  
  # Networking
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  
  # Local Storage
  flutter_secure_storage: ^9.2.4
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.28
  
  # Firebase
  firebase_core: ^3.11.0
  firebase_messaging: ^15.2.0
  
  # UI
  intl: ^0.20.2
  shimmer: ^3.0.0
  fl_chart: ^0.69.2
  cached_network_image: ^3.4.1
  
  # Utils
  connectivity_plus: ^6.1.1
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  path_provider: ^2.1.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  path: ^1.9.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.0
  freezed: ^2.5.8
  riverpod_generator: ^2.6.3
  drift_dev: ^2.23.1
  # Tests: fake injectable du lanceur de liens (url_launcher)
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  # i18n : active la génération automatique de lib/l10n/*.arb → AppLocalizations
  generate: true
  assets:
    - assets/images/
    - assets/icons/

